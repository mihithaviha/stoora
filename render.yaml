# Render.com blueprint: one web service from the Dockerfile with a disk for the database.
# Secrets (keys) are NOT written here: add them in the Render dashboard under Environment.
services:
  - type: web
    name: stoora
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    autoDeploy: false
    disk:
      name: stoora-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_URL            # set to your real https address, for example https://stoora.in
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
