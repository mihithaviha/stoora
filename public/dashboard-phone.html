<style>
/* Layout: a phone prototype (Shopify layout, Stoora brand kit). Wide screens: phone frame + screen list. Phones: full screen. Single light look. */
:root{
  --surface:#FFFFFF; --card:#F7F7F7; --inner:#FFFAEF; --muted:#F2EADD; --line:#E0D6CA; --line-soft:#EBE3DA;
  --ink:#171C3C; --ink-soft:#303652; --ink-65:#725F54; --ink-45:#938378;
  --primary:#EA5B1E; --marigold:#FFB407; --positive:#0FA05C; --negative:#DE3C37;
  --primary-deep:#9A3412; --primary-tint:#FFE4D3; --marigold-deep:#6E4A00; --marigold-tint:#FFE9B0;
  --positive-deep:#065F37; --positive-tint:#DCEFDF; --negative-deep:#951F27; --negative-tint:#F8D6D5;
  --ai:#8B3A9E; --ai-soft:color-mix(in srgb,#D13A5B 9%,#FFFFFF);
  --gradient-action:linear-gradient(90deg,#ffb347 0%,#ff6b2c 55%,#c13fa8 100%);
  --gradient-warm:linear-gradient(135deg,#fbe0a8 0%,#f4a24a 14%,#ef7f3d 28%,#dc4a3a 42%,#d13a5b 56%,#8b3a9e 70%,#5f3ba8 84%,#262a7a 100%);
  --gradient-soft:linear-gradient(180deg,#FFFAEF 0%,#FFEFD5 100%);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(23,28,60,.04),0 8px 24px rgba(23,28,60,.06);
  --float:0 0 0 1px rgba(23,28,60,.08),0 8px 24px rgba(23,28,60,.12);
  --ease:cubic-bezier(.2,.8,0,1);
  color-scheme:light;
}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:1em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:-.14em;color:inherit}
.thumb .ms,.setup .art .ms{color:var(--ink-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:15px;line-height:22px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.side{width:300px;max-height:844px;overflow:auto;display:grid;gap:14px;align-content:start}
.side h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0}
.side p{margin:0;font-size:14px;color:var(--ink-soft)}
.side .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-65);margin-top:6px}
.side .grp{display:grid;gap:2px}
.side .grp button{text-align:left;font-size:14px;padding:6px 10px;border-radius:10px;color:var(--ink-soft)}
.side .grp button:hover{background:var(--card)}
.side .grp button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.side .grp b{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-45);margin-right:6px;font-weight:500}
.reset{justify-self:start;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.phone{position:relative;flex:none}
.sbtn{position:absolute;width:4px;background:#2a2f52;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 30px;background:var(--card);font-size:14px;font-weight:600;color:var(--ink);transition:background .2s,color .2s}
.sbar .sl,.sbar .sr{display:flex;align-items:center;gap:6px}
.sbar .bat{display:flex;align-items:center;gap:4px;font-size:13px}
.sbar.dark{background:var(--ink);color:#fff}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:18px;background:#0b0d1a;z-index:71;display:grid;place-items:center end;padding-right:16px}
.notch i{width:10px;height:10px;border-radius:50%;background:#1d2340;box-shadow:inset 0 0 0 2px #2e3560}
.vp{position:absolute;top:44px;left:0;right:0;bottom:42px;overflow:hidden}
.navbar{position:absolute;left:0;right:0;bottom:0;height:42px;z-index:70;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line-soft);padding:0 40px}
.navbar button{width:56px;height:36px;display:grid;place-items:center;border-radius:18px;color:var(--ink-soft)}
.navbar button:active{background:var(--muted)}
.navbar button::before{content:"";display:block}
.navbar button:nth-child(1)::before{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:11px solid currentColor;opacity:.75}
.navbar button:nth-child(2)::before{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;opacity:.75}
.navbar button:nth-child(3)::before{width:13px;height:13px;border-radius:3px;border:2px solid currentColor;opacity:.75}
.device{position:relative;width:390px;height:844px;border-radius:48px;background:var(--card);box-shadow:0 0 0 10px var(--ink),0 30px 80px rgba(23,28,60,.25);overflow:hidden;flex:none}
@media (max-width:760px){
  body{background:var(--surface)}
  .stage{padding:0;display:block}
  .side{display:none}
  .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .phone{width:100%}
  .sbar,.notch,.navbar,.sbtn{display:none}
  .vp{top:0;bottom:0}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 0 120px;scrollbar-width:none;transition:transform .35s var(--ease),border-radius .35s var(--ease)}
.screen::-webkit-scrollbar{display:none}
.pad{padding-left:20px;padding-right:20px}
/* top row */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 20px 10px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px)}
.top .title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex:1;min-width:0}
.top .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:999px;background:var(--card);display:grid;place-items:center;box-shadow:var(--float);flex:none;position:relative}
.ibtn.dark{background:var(--ink);color:#fff}
.ibtn .dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--negative);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.btn{height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--gradient-action);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.grey{background:var(--muted);color:var(--ink)}
.btn.line{background:var(--card);border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.full{width:100%}
.h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:32px;letter-spacing:-.01em;margin:6px 0 4px}
.h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:26px;margin:0}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-65);margin:22px 4px 8px}
.muted{color:var(--ink-65)} .small{font-size:13px;line-height:18px} .tiny{font-size:12px;line-height:16px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.hr{height:1px;background:var(--line-soft);margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.tag.ok{background:var(--positive-tint);color:var(--positive-deep)}
.tag.warn{background:var(--marigold-tint);color:var(--marigold-deep)}
.tag.bad{background:var(--negative-tint);color:var(--negative-deep)}
.tag.neutral{background:var(--muted);color:var(--ink-soft)}
.tag.ai{background:var(--ai-soft);color:var(--ai)}
.tag.src::before{display:none}
.tag.src{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.low{color:var(--negative-deep)}
/* tabs & chips */
.seg{display:flex;background:var(--muted);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;height:36px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-65)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,28,60,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--inner);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{min-width:20px;height:20px;border-radius:10px;background:var(--muted);color:var(--ink);font-size:12px;display:grid;place-items:center;padding:0 6px}
.chip.on .n{background:rgba(255,255,255,.2);color:#fff}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line);background:var(--inner);border-radius:12px;padding:0 12px;color:var(--ink-65)}
/* list rows */
.list{display:grid;gap:8px}
.box.ctl{display:grid;gap:12px;padding:12px;margin-bottom:12px}
.box.ctl .search{background:var(--inner);border-color:var(--line-soft)}
.box.ctl .chips,.box.ctl .seg{margin:0!important}
.box.head{margin-bottom:12px}
.box.head .h1{margin:0}
.list-t{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-65)}
.li{display:flex;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);text-align:left;width:100%;align-items:flex-start;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
button.li:hover{transform:translateY(-1px);border-color:var(--line);box-shadow:0 2px 4px rgba(23,28,60,.05),0 10px 24px rgba(23,28,60,.09)}
button.li:active{transform:scale(.98);background:var(--muted)}
.thumb{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:22px;background:var(--inner)}
.av{width:40px;height:40px;border-radius:999px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.money{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.unread{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none;margin-top:6px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat .k{font-size:12px;color:var(--ink-65)}
.stat .v{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi .k{font-size:13px;color:var(--ink-65);text-decoration:underline dotted;text-underline-offset:3px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--positive);box-shadow:0 0 0 0 rgba(15,160,92,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(15,160,92,0)}100%{box-shadow:0 0 0 0 rgba(15,160,92,0)}}
/* setup cards: a small photo beside a title, one short line and one button */
.card.setup{padding:0;overflow:hidden;display:grid;grid-template-columns:104px minmax(0,1fr)}
.setup .art{align-self:start;aspect-ratio:1;margin:12px 0 12px 12px;border-radius:12px;background:var(--muted);overflow:hidden}
.setup .art img{display:block;width:100%;height:100%;object-fit:cover}
.setup .body{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 12px 14px 14px}
.setup .s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;align-self:stretch}
.setup .body b{font-family:var(--display);font-weight:600;font-size:16px;line-height:21px}
.setup .body .muted{flex:1;font-size:14px;line-height:20px}
.setup .body .btn{margin-top:8px}
.setup .x{flex:none;width:32px;height:32px;margin:-5px -6px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--ink-65)}
.setup .x:focus-visible,.setup .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* AI */
.aibox{background:var(--ai-soft);border:1px solid color-mix(in srgb,var(--ai) 22%,var(--card));border-radius:16px;padding:14px}
.aibox .who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ai)}
.idea{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.earn{display:flex;gap:8px;flex-wrap:wrap}
.earn span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--muted)}
.earn span.g{background:color-mix(in srgb,var(--positive) 13%,var(--card));color:#0a6e40}
/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.input{height:48px;border:1px solid var(--line);background:var(--inner);border-radius:12px;padding:0 14px;width:100%;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent)}
textarea.input{height:90px;padding:12px 14px;resize:none}
.money-in{display:flex;align-items:center;border:1px solid var(--line);background:var(--inner);border-radius:12px;padding-left:14px}
.money-in input{border:0;background:none;height:48px;flex:1;outline:none;padding-right:14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;background:var(--inner);padding:22px;display:grid;justify-items:center;gap:8px;text-align:center}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{height:32px;padding:0 12px;border-radius:10px;background:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mini.ai{background:var(--ai-soft);color:var(--ai);border:1px solid color-mix(in srgb,var(--ai) 25%,var(--card))}
.switch{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ink)} .switch.on::after{transform:translateX(16px)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.step input{width:56px;text-align:center;border:0;height:44px;background:none;outline:none}
.step button{width:44px;height:44px;background:var(--muted);font-size:20px}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink-45);display:grid;place-items:center;flex:none;background:var(--card)}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sum{display:grid;gap:8px}
.sum .r{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sum .r.t{font-weight:700;font-size:16px}
.link{color:var(--primary-deep);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px}
.banner.bad{background:var(--negative-tint);color:var(--negative-deep)}
.banner.info{background:var(--marigold-tint);color:var(--marigold-deep)}
.timeline{display:grid;gap:12px;font-size:14px}
.timeline .ev{display:flex;gap:10px}
.timeline .ev i{width:9px;height:9px;border-radius:50%;background:var(--ink-45);margin-top:7px;flex:none}
/* bottom bar */
.bar{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;z-index:20;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.bar .round{width:56px;height:56px;border-radius:999px;background:var(--card);box-shadow:var(--float);display:grid;place-items:center;flex:none}
.bar .pill{flex:1;height:60px;border-radius:999px;background:var(--card);box-shadow:var(--float);display:flex;padding:4px;gap:2px}
.bar .pill button{flex:1;border-radius:999px;display:grid;place-items:center;align-content:center;gap:1px;color:var(--ink-45);font-size:12px;font-weight:600;line-height:14px;position:relative}
.bar .pill button.on{background:var(--muted);color:var(--ink)}
.bar .pill .badge{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.smark{width:30px;height:30px;border-radius:50%;background:var(--gradient-warm);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:17px}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(23,28,60,.5);z-index:30;animation:fade .25s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:32;background:var(--card);border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto;animation:up .3s var(--ease)}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.drawer{position:absolute;inset:0;z-index:40;background:var(--ink);color:#fff;animation:fade .2s}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:84%;padding:22px 14px;display:flex;flex-direction:column;gap:4px;animation:slide .3s var(--ease)}
.drawer .peek{position:absolute;top:60px;bottom:60px;left:86%;right:-40%;background:var(--surface);border-radius:28px;opacity:.9}
.drawer .nav{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:14px;font-size:17px;color:#d9d6e6;text-align:left;width:100%}
.drawer .nav.on{background:rgba(255,255,255,.12);color:#fff}
.drawer .grp{font-size:14px;font-weight:600;color:#9a96ad;margin:14px 12px 4px}
.drawer .foot{margin-top:auto;display:flex;gap:10px;justify-content:center}
.drawer .foot button{height:48px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600}
.drawer .dsearch{height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;padding:0 12px;color:#9a96ad;margin:12px 0 8px}
.pop{position:absolute;top:66px;left:12px;right:12px;z-index:32;background:var(--card);border-radius:16px;box-shadow:0 20px 50px rgba(23,28,60,.25);overflow:hidden;animation:fade .2s}
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:drop .25s var(--ease)}

 if(t.name==='orders'){ui.orderTab='orders'} if(t.name==='bookings'){ui.orderTab='bookings';route.name='orders'}

/* v2 polish: calm entrance, count-up numbers. Runs only when a new screen opens. */
const ANIM_SEL='.hero,.card,.box,.li,.trow,.kpi,.tile,.mstrip,.idea,.set-row,.setup,.tbox,.tbl tbody tr,.sec-t,.list-t,.h1,.banner';
function countUp(el){const t=el.textContent.trim();const m=t.match(/^(\u20B9?)([\d,]+)(.*)$/);if(!m)return;const n=+m[2].replace(/,/g,'');if(!(n>=2))return;
 const f=v=>m[1]+Math.round(v).toLocaleString('en-IN')+m[3];const t0=performance.now(),d=n>999?900:700;
 (function step(now){const p=Math.min(1,(now-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(n*e);if(p<1)requestAnimationFrame(step);else el.textContent=t})(t0)}
function animateScreen(){const sc=document.getElementById('screen');if(!sc)return;sc.classList.remove('enter');void sc.offsetWidth;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 let i=0;sc.querySelectorAll(ANIM_SEL).forEach(el=>{const p=el.parentElement.closest(ANIM_SEL);if(p&&sc.contains(p))return;el.classList.add('anim');el.style.setProperty('--i',Math.min(i++,12))});
 sc.querySelectorAll('.bars').forEach(b=>[...b.children].forEach((c,k)=>c.style.setProperty('--b',k)));
 sc.querySelectorAll('.tile .v,.kpi .v,.mstrip .v,.stat .v').forEach(countUp);
 sc.classList.add('enter');clearTimeout(animateScreen.t);animateScreen.t=setTimeout(()=>sc.classList.remove('enter'),1800)}
