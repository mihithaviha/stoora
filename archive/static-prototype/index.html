function moveCmpThumb(){ const th=$('.cmp-thumb'), on=$('.cmp [aria-checked="true"]'); if(!th||!on) return; th.style.width=on.offsetWidth+'px'; th.style.transform=`translateX(${on.offsetLeft-4}px)` }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function messGeo(){ const st=$('#mstage'); const W=st.clientWidth; const H=MESS.length*MROW+MLBL*2; st.style.height=H+'px'; return {st,W,H} }
function layoutMess(t){ const st=$('#mstage'); if(!st) return; const {W,H}=messGeo(); const cw=Math.min(300,Math.max(W*.6,230));
 st.querySelectorAll('.mcard').forEach((c,i)=>{ const r=RANK[i]; const local=Math.min(1,Math.max(0,(t-r*.07)/.6)); const e=ease(local);
  const [x,y,rot]=MESS[i][6]; const mx=x*(W-cw)/.55*.55, my=y*(H-70)+4;
  const ty=r*MROW+(r>=2?MLBL*2:MLBL);
  c.style.width=(cw+(W-cw)*e).toFixed(1)+'px'; c.style.transform=`translate(${(mx*(1-e)).toFixed(1)}px,${(my*(1-e)+ty*e).toFixed(1)}px) rotate(${(rot*(1-e)).toFixed(2)}deg)`;
  c.style.zIndex=t>.5?20-r:10+i;
  const k=Math.min(1,Math.max(0,(local-.35)/.35)); c.querySelector('.messy').style.opacity=(1-k).toFixed(3); c.querySelector('.tidy').style.opacity=k.toFixed(3);
  const b=c.querySelector('.bdg'); const kb=Math.min(1,Math.max(0,(local-.7)/.3)); b.style.opacity=kb.toFixed(3); b.style.transform=`scale(${(.88+.12*kb).toFixed(3)})`;
  c.classList.toggle('lit',t>.98&&RANK[i]<2) });
 const la=Math.min(1,Math.max(0,(t-.55)/.35)); ['#ml-a','#ml-b'].forEach(s=>{ const el=$(s); el.style.opacity=la.toFixed(3); el.style.transform=`translateY(${((1-la)*6).toFixed(1)}px)` });
 $('#ml-b').style.top=(2*MROW+MLBL+4)+'px' }
function setCmp(v,user){ if(user) L.cmpTouched=1; if(L.cmp===v&&L.cmpT!=null) return; L.cmp=v;
 const m=$('#mess'); if(!m) return; m.classList.toggle('with',!!v);
 m.querySelectorAll('.cmp [role=radio]').forEach(b=>{ const on=+b.dataset.v===v; b.setAttribute('aria-checked',on); b.tabIndex=on?0:-1 }); moveCmpThumb();
 $('#mess-live').textContent=v?'With Stoora: one list. Ananya is ready to buy and the yoga booking is unpaid, so they come first. Four items are handled and marked.':'Before Stoora: six messages spread across the gallery, DMs, WhatsApp and notes, with nothing marked.';
 cancelAnimationFrame(L.cmpRaf); const from=L.cmpT??0, to=v?1:0;
 if(reduced()){ L.cmpT=to; layoutMess(to); return }
 const dur=v?1150:800, t0=performance.now();
 const step=now=>{ const k=Math.min(1,(now-t0)/dur); L.cmpT=from+(to-from)*k; layoutMess(L.cmpT); if(k<1) L.cmpRaf=requestAnimationFrame(step) }; L.cmpRaf=requestAnimationFrame(step) }

function audBody(i){ const a=AUD[i]; return `<div class="aud-body aud-photo">
 <figure class="aphoto" style="--k:1"><img src="${PHOTOS[a.photo]}" alt="${a.alt}" width="960" height="717" loading="lazy" decoding="async"><figcaption>Illustrative photo</figcaption></figure>
 <div class="atext"><span class="ey" style="--k:2">${a.t}</span><h3 class="l-h3" style="--k:3">${a.h}</h3><p class="t-soft" style="--k:4">${a.how}</p><div class="aud-snip" style="--k:5">${a.snip.map(s=>bdg(...s)).join('')}</div></div></div>` }
function audPanel(i){ return `<div class="aud-panel" data-accent="${AUD[i].acc}" role="tabpanel" id="aud-p" aria-labelledby="aud-t${i}" tabindex="0">${audBody(i)}</div>` }
function moveAudInd(){ const on=$('.aud-tab[aria-selected="true"]'), ind=$('#aud-ind'); if(!on||!ind) return;
 ind.style.transform=`translate(${on.offsetLeft}px,${on.offsetTop}px)`; ind.style.width=on.offsetWidth+'px'; ind.style.height=on.offsetHeight+'px'; ind.style.opacity=1 }
function selectAud(i,focus){ const tabs=[...document.querySelectorAll('.aud-tab')]; if(!tabs[i]) return;
 tabs.forEach((t,j)=>{ t.setAttribute('aria-selected',j===i); t.tabIndex=j===i?0:-1 }); if(focus) tabs[i].focus(); moveAudInd();
 const p=$('#aud-p'); if(!p||+p.dataset.i===i) return; p.dataset.i=i; p.setAttribute('aria-labelledby','aud-t'+i); p.dataset.accent=AUD[i].acc;
 clearTimeout(L.audT); const old=p.querySelector('.aud-body');
 if(reduced()||!old){ p.innerHTML=audBody(i); return }
 old.classList.add('leave'); L.audT=setTimeout(()=>{ p.innerHTML=audBody(i); p.querySelector('.aud-body').classList.add('enter2') },140) }

/* ---------- feature previews: real dashboard screens, sample shop ---------- */
function previews(){ const keep=S; S=fresh(); const tmp=document.createElement('div'); const out={};
 try{
  tmp.innerHTML=homeScreen().body; out.morning=`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s3);align-items:start">${tmp.querySelector('.morning').outerHTML}${tmp.querySelector('[aria-labelledby="today-h"]').outerHTML}</div>`;
  tmp.innerHTML=ordersScreen().body; tmp.querySelector('.phead').remove(); out.orders=tmp.innerHTML;
  out.chats=`<div class="banner info" style="margin-bottom:var(--s3);align-items:center"><span class="smark xs">S</span><span><b class="t-ink">2 buyers are ready to buy.</b> Replies are drafted. Check them and send.</span></div><div class="card flush" style="display:flex;flex-direction:column">${convHTML(S.chats[0])}</div>`;
  tmp.innerHTML=moneyScreen().body; tmp.querySelector('.phead').remove(); out.money=tmp.innerHTML;
  out.ask=`<div class="ans" style="max-width:640px;margin-left:auto"><div class="qbubble">How did I do this week?</div><div class="abox"><div class="who"><span class="smark xs">S</span>Stoora</div>${answer('how did i do this week')}</div></div>`;
 }finally{ S=keep }
 return out }
function frame(html,crumb){ return `<div class="frame rv"><div class="bar2"><span class="appicon" style="width:22px;height:22px;font-size:12px;border-radius:7px">S</span><span class="wordmark">stoora<i>.in</i></span><span>›</span><span>${crumb}</span></div><div class="vp"><div class="in2 force-wide" inert aria-hidden="true">${html}</div></div><span class="note">Sample shop</span></div>` }
function fitFrames(){ document.querySelectorAll('#site .frame .vp').forEach(vp=>{ const in2=vp.firstElementChild; const k=Math.min(1,vp.clientWidth/900); in2.style.transform=`scale(${k})`; vp.style.height=Math.min(in2.offsetHeight*k,(innerWidth<760?380:560))+'px' }) }

function buildLanding(){ const site=$('#site'); if(!$('#st-defs')){ document.body.insertAdjacentHTML('afterbegin',WC_DEFS.replace('<svg ','<svg id="st-defs" ')) }

 if(stage){ stage.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse'){ L.hover=true; cycle() } }); stage.addEventListener('pointerleave',()=>{ L.hover=false; cycle() });

  new IntersectionObserver(es=>{ L.visible=es[0].isIntersecting; cycle() },{threshold:.25}).observe(stage);

 // comparison: sorts itself once when first seen, unless the visitor has already used the control
 L.cmp=0; L.cmpT=0; layoutMess(0); moveCmpThumb();

/* A Tuesday with Stoora — desktop: the section pins and vertical scroll moves the cards sideways.
   The section is exactly (pinned height + horizontal distance) tall, so the pin releases on the last card.
   Narrow screens and reduced motion: a plain vertical timeline. No wheel handlers. */
function dayMode(){ return innerWidth>=980&&!reduced() }
function layoutDay(){ const day=$('#day'), pin=$('#daypin'), view=$('#dayview'), tr=$('#daytrack'); if(!day) return;
 day.classList.toggle('pinned',dayMode());
 if(!dayMode()){ day.style.height=''; tr.style.transform=''; pin.style.top=''; L.dayDist=0; tr.querySelectorAll('.dcard').forEach(c=>{c.style.opacity='';c.classList.remove('now')}); return }
 const cs=getComputedStyle(view); const inner=view.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight); L.dayDist=Math.max(0,tr.scrollWidth-inner);
 pin.style.top=Math.max(88,(innerHeight-pin.offsetHeight)/2)+'px'; day.style.height=(pin.offsetHeight+L.dayDist)+'px' }
function dayScroll(vh){ const day=$('#day'); if(!day||!dayMode()||!L.dayDist) return; const pin=$('#daypin'), tr=$('#daytrack');
 const top=parseFloat(getComputedStyle(pin).top)||0; const p=Math.min(1,Math.max(0,(top-day.getBoundingClientRect().top)/L.dayDist));
 tr.style.transform=`translate3d(${(-p*L.dayDist).toFixed(1)}px,0,0)`; day.style.setProperty('--p',p.toFixed(4));
 const vw=$('#dayview').clientWidth, lineX=p*tr.scrollWidth;
 tr.querySelectorAll('.dcard').forEach(c=>{ const x=c.offsetLeft-p*L.dayDist; const vis=1-Math.min(1,Math.max(0,(x-vw*.78)/(vw*.3))); c.style.opacity=(.4+.6*vis).toFixed(3); c.classList.toggle('now',c.offsetLeft+20<=lineX) }) }
let scrollRaf=0;
function onScroll(){ if(MODE!=='public') return; const nav=$('#lnav'); if(!nav) return;

 if(act!==L.navAct){ L.navAct=act; document.querySelectorAll('.lnav .links button').forEach(b=>{ const on=b.dataset.t===act; b.classList.toggle('on',on); on?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current') }); moveInd('#lind',act?$(`.lnav .links button[data-t="${act}"]`):null) }
 stepScroll(vh); dayScroll(vh);
}

function lineChart(xs,vs,label){ const W=600,H=210,pl=56,pr=18,pt=16,pb=30; const max=Math.ceil(Math.max(...vs)/2000)*2000||1;
 const X=i=>pl+i*(W-pl-pr)/(vs.length-1), Y=v=>pt+(H-pt-pb)*(1-v/max);
 const pts=vs.map((v,i)=>[X(i),Y(v)]); const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const area=line+` L${X(vs.length-1)} ${H-pb} L${pl} ${H-pb} Z`; const best=vs.indexOf(Math.max(...vs));
 return `<figure class="lchart" role="img" aria-label="${label}: ${xs.map((x,i)=>x+' '+rs(vs[i])).join(', ')}"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
  ${[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(max*f)}" y2="${Y(max*f)}" class="g"/><text x="${pl-8}" y="${Y(max*f)+4}" text-anchor="end" class="yl">${rs(max*f)}</text>`).join('')}
  <path d="${area}" class="ar"/><path d="${line}" class="ln"/>
  ${pts.map((p,i)=>`<g class="pt ${i===vs.length-1?'end':''} ${i===best?'best':''}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===vs.length-1?5:3.5}"/><title>${xs[i]}: ${rs(vs[i])}</title></g>`).join('')}
  ${xs.map((x,i)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="xl ${i===vs.length-1?'now':''}">${x}</text>`).join('')}
  <text x="${pts[vs.length-1][0]-8}" y="${pts[vs.length-1][1]-12}" text-anchor="end" class="vl">${rs(vs[vs.length-1])}</text>
 </svg></figure>` }
function hbars(rows,fmt){ const m=Math.max(...rows.map(r=>r[1]),1); return `<div class="stack tight" role="list">${rows.map(([l,v])=>`<div class="hbar" role="listitem"><div class="top2"><span>${esc(l)}</span><span class="num t-ink">${fmt(v)}</span></div><div class="trk"><i style="width:${(v/m*100).toFixed(1)}%"></i></div></div>`).join('')}</div>` }
function splitBar(parts,fmt=rs){ const tot=parts.reduce((a,p)=>a+p[1],0)||1; return `<div class="split" role="img" aria-label="${parts.map(p=>p[0]+' '+fmt(p[1])).join(', ')}"><div class="sbar">${parts.filter(p=>p[1]).map(([l,v,k])=>`<i class="${k}" style="flex:${v}"></i>`).join('')}</div><div class="slg">${parts.map(([l,v,k])=>`<span><i class="${k}"></i>${l} <b class="num">${fmt(v)}</b></span>`).join('')}</div></div>` }

function assistRules(){ return `You are Stoora, the shop assistant inside the Stoora seller dashboard. You are talking to ${S.shop.owner}, who runs ${S.shop.name}, a small business in India. Many sellers have never used business software.
How to write: plain, warm English a 15-year-old understands. Short sentences. No jargon — if you need a metric, say it in everyday words (not "conversion rate" but "people who visited and bought"). No emoji. No exclamation marks. Money in rupees with Indian grouping, like ₹1,499 or ₹1,28,460.
Truth: use ONLY the numbers and names in SHOP DATA. Never invent figures, products, buyers or comparisons. If the data does not cover the question, say so plainly and name what is missing (see notAvailable). You cannot send messages, post, change prices or change anything yourself — you can only suggest one action button, and the seller decides.
Reply with ONLY one JSON object, no other text:
{"answer": "1-2 sentences that directly answer the question",
 "facts": ["up to 4 short facts with real numbers from SHOP DATA"],
 "chart": one of ${JSON.stringify(Object.keys(DATASETS))} or null — only when a picture truly helps,
 "chartNote": "one plain sentence on what the chart shows" or null,
 "next": "one recommended next step, in plain words" or null,
 "action": one of ${JSON.stringify(Object.keys(ACTIONS))} or null}
Example: {"answer":"Two buyers still owe you ₹2,699.","facts":["Rahul owes ₹1,499 for order #1011","Arjun owes ₹1,200 for his yoga session"],"chart":"money_status","chartNote":"Most of today’s money is in; a small part is still waiting.","next":"Send both a polite UPI reminder.","action":"remind_unpaid"}`}
function cleanRes(r){ if(!r||typeof r!=='object') throw {code:'invalid_json'}; const s=v=>typeof v==='string'&&v.trim()?v.trim():null;
 const a=s(r.answer); if(!a) throw {code:'invalid_json'};
 return {answer:a,facts:Array.isArray(r.facts)?r.facts.map(s).filter(Boolean).slice(0,4):[],chart:DATASETS[r.chart]?r.chart:null,chartNote:s(r.chartNote),next:s(r.next),action:ACTIONS[r.action]?r.action:null} }

function computedAnswer(q){ const t=q.toLowerCase(); const w=moneyWaiting(), wt=w.reduce((a,x)=>a+x.amt,0), c=counts(); const ready=S.chats.filter(x=>x.mood==='ready'&&x.unread).length;
 if(/pay|owe|money|waiting|pending/.test(t)) return {answer:`${plural(w.length,'buyer')} still owe you ${rs(wt)}.`,facts:w.map(x=>`${x.who} owes ${rs(x.amt)} (${x.ref})`),chart:'money_status',chartNote:`You received ${rs(MR.today.rec)} today. ${rs(wt)} is still to come.`,next:'Send a polite UPI reminder to each of them.',action:'remind_unpaid'};
 if(/product|stock|attention|promote|sell/.test(t)) return {answer:'The indigo kurta set needs you most: 12 people looked at it yesterday and only 3 are left.',facts:S.products.filter(p=>p.stock<=3).map(p=>`${p.name}: ${p.stock===0?'sold out':p.stock+' left'}`),chart:'product_views',chartNote:'More people looked at the indigo kurta set yesterday than any other product.',next:'Restock it, or post that only 3 are left.',action:'draft_post'};
 if(/order|ship/.test(t)) return {answer:`You have ${plural(c.toShip,'order')} to ship and ${plural(c.unpaidOrders,'order')} not paid yet.`,facts:S.orders.slice(0,4).map(o=>`#${o.id} · ${o.who} · ${rs(o.total)} · ${o.paid?'paid':'not paid'}${o.shipped?' · shipped':''}`),chart:'order_status',chartNote:'Most of your orders are paid and on their way.',next:'Pack the paid order first.',action:'open_orders_to_ship'};
 if(/first|focus|today|update|how/.test(t)) return {answer:`Today you have made ${rs(8195)} so far — already more than all of yesterday (${rs(6940)}).`,facts:[`${plural(ready,'buyer is','buyers are')} ready to buy, with replies drafted`,`${plural(c.toShip,'paid order')} waiting to ship`,`${rs(wt)} still to be paid`],chart:'sales_7d',chartNote:'Saturday was your best day this week. Today is already your second best.',next:'Reply to the buyers who are ready to buy, then ship the paid order.',action:'review_messages'};
 return {answer:'Live answers aren’t available here, so Stoora can only answer the suggested questions from your shop’s numbers.',facts:[],chart:null,chartNote:null,next:null,action:null} }

let askCtl=null;
ask=async function(q){ q=String(q||'').trim(); if(!q) return; const m={q,status:'thinking'}; S.askLog.push(m); renderAsk();
 const sample=await SAMPLE_P;
 if(!sample||AI_OFF){ m.res=computedAnswer(q); m.computed=true; m.status='done'; renderAsk(); return }
 const turns=[{role:'user',content:assistRules()+'\n\nSHOP DATA (this seller only):\n'+JSON.stringify(bizSnapshot())}];
 S.askLog.filter(x=>x!==m&&x.status==='done'&&!x.computed).slice(-3).forEach(p=>{ turns.push({role:'user',content:p.q}); turns.push({role:'assistant',content:JSON.stringify(p.res)}) });
 turns.push({role:'user',content:q});
 askCtl=new AbortController(); m.ctl=askCtl;
 try{ m.res=cleanRes(await sample.json(turns,{modelTier:'quick',cache:false,signal:askCtl.signal})); m.status='done' }
 catch(e){ if(e&&e.code==='cancelled'){ m.status='stopped' } else { m.status='error'; m.err=e&&e.code; aiOffIf(m.err) } }
 renderAsk() };
function resHTML(m){ const r=m.res; return `<p class="a-main">${esc(r.answer)}</p>
 ${r.facts.length?`<ul class="a-facts">${r.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
 ${r.chart?`<div class="a-chart"><p class="label">${DATASETS[r.chart].t}</p>${DATASETS[r.chart].render()}${r.chartNote?`<p class="cap">${esc(r.chartNote)}</p>`:''}</div>`:''}
 ${r.next||r.action?`<div class="a-next"><span class="label">${ic('arrow_forward','xs')}Next step</span>${r.next?`<p class="t-soft">${esc(r.next)}</p>`:''}${r.action?`<button class="btn ink sm" data-act="ai-act" data-a="${r.action}">${ACTIONS[r.action].l}</button>`:''}</div>`:''}
 <p class="a-src">${m.computed?`${ic('calculate','xs')}Worked out from your shop’s numbers. Live AI answers aren’t available in this view.`:`${ic('auto_awesome','xs')}Written by Stoora from your shop’s data. Check important numbers before acting.`}</p>` }

 const field=(id,label,key,ph,flag,attrs='')=>`<div class="field"><label for="${id}">${label}</label><input class="input ${flag?'flag':''}" id="${id}" data-aid="${key}" value="${esc(d[key])}" placeholder="${ph}" ${attrs}>${flag?`<span class="fl">${ic('help','xs')}${flag}</span>`:''}</div>`;
 return `<div class="banner info anim" style="--i:0">${ic('edit_note')}<span><b class="t-ink">This is a draft.</b> It is not in your orders yet. Nothing is added until you tap “Approve and create order”.</span></div>
 ${iss.length?`<section class="card anim needs" style="--i:1" aria-labelledby="nd-h"><h2 class="ct" id="nd-h">${ic('flag')}${plural(iss.length,'thing needs','things need')} your attention</h2><ul>${iss.map(x=>`<li><button class="link" data-act="ai-focus" data-f="${x.f}">${x.t}</button></li>`).join('')}</ul></section>`:''}
 <div class="form2"><div>
  <section class="card anim stack" style="--i:2"><h2 class="ct">${ic('person')}Customer</h2>
   <div class="grid2">${field('ai-name','Buyer’s name <span class="req">Required</span>','name','Not in the chat',d.name?'':'Not found in the chat')}${field('ai-phone','WhatsApp number <span class="opt">Optional</span>','phone','Not in the chat','', 'type="tel" inputmode="tel"')}</div></section>
  <section class="card anim" style="--i:3"><div class="card-h"><h2 class="ct">${ic('shopping_bag')}Products and quantities</h2><button class="btn line sm" id="ai-add" data-act="ai-additem">${ic('add')}Add product</button></div>
   ${d.items.length?`<div class="stack tight">${d.items.map((it,n)=>{const P=it.pid&&prod(it.pid); const opts=it.cands.length?it.cands:[]; return `<div class="ai-item">
    <p class="said">${ic('format_quote','xs')}Buyer said: “${esc(it.said)}”</p>
    <div class="ai-row">
     <div class="field grow"><label for="ai-p-${n}">Product</label><select class="input ${P?'':'flag'}" id="ai-p-${n}" data-aitem="${n}" data-k="pid"><option value="">${it.cands.length>1?'Choose one of the matches…':'Choose a product…'}</option>${opts.length?`<optgroup label="Matches from the chat">${opts.map(id=>`<option value="${id}" ${it.pid===id?'selected':''}>${esc(prod(id).name)} · ${rs(prod(id).price)}</option>`).join('')}</optgroup>`:''}<optgroup label="All products">${S.products.filter(p=>p.status==='Active'&&!opts.includes(p.id)).map(p=>`<option value="${p.id}" ${it.pid===p.id?'selected':''}>${esc(p.name)} · ${rs(p.price)}</option>`).join('')}</optgroup></select></div>
     ${P&&P.sizes&&P.sizes.length?`<div class="field"><label for="ai-s-${n}">Size</label><select class="input ${it.size?'':'flag'}" id="ai-s-${n}" data-aitem="${n}" data-k="size"><option value="">Size…</option>${P.sizes.map(z=>`<option ${it.size===z?'selected':''}>${z}</option>`).join('')}</select></div>`:''}
     <div class="field"><label for="ai-q-${n}">How many</label><input class="input qty ${it.qty&&(!P||it.qty<=P.stock)?'':'flag'}" id="ai-q-${n}" inputmode="numeric" data-aitem="${n}" data-k="qty" value="${it.qty}" placeholder="?"></div>
     <button class="ibtn flat" data-act="ai-rmitem" data-i="${n}" aria-label="Remove this item" style="align-self:end">${ic('delete','sm')}</button></div>
    ${P?`<p class="cap">${rs(P.price)} each from your catalog · ${P.stock} in stock${it.qty?` · line total <b class="t-ink num">${rs(P.price*it.qty)}</b>`:''}</p>`:it.cands.length>1?`<p class="cap fl">${ic('help','xs')}${it.cands.length} products could match. Pick the right one.</p>`:''}
   </div>`}).join('')}</div>`:`<p class="t-soft">No products were found in the chat. Add the product the buyer wants.</p>`}</section>
  <section class="card anim stack" style="--i:4"><h2 class="ct">${ic('local_shipping')}Delivery</h2>
   <div class="grid2">${field('ai-city','City','city','Not in the chat',d.city?'':'Not in the chat')}${field('ai-addr','Full address','address','Not in the chat',d.address?'':'Ask the buyer before shipping')}</div>
   <div class="field"><label for="ai-ship">Delivery charge <span class="opt">Optional</span></label><div class="affix"><span aria-hidden="true">₹</span><input id="ai-ship" inputmode="numeric" data-aid="ship" value="${esc(d.ship)}" placeholder="0"></div><span class="hint">Stoora doesn’t guess delivery charges. Leave empty for free delivery.</span></div></section>
  <section class="card anim stack" style="--i:5"><h2 class="ct" id="ai-pay-l">${ic('payments')}Payment</h2>
   ${d.buyerSaysPaid?`<div class="banner warn">${ic('info')}<span>The buyer says they’ve paid${d.paySaid?`: “${esc(d.paySaid)}”`:''}. Check your UPI app before choosing “Paid already”.</span></div>`:d.paySaid?`<p class="cap">${ic('format_quote','xs')}About payment, the buyer said: “${esc(d.paySaid)}”</p>`:''}
   <div class="stack tight" role="radiogroup" aria-labelledby="ai-pay-l">${[['upi','Not paid yet — send a UPI link','Marked paid when the money arrives.'],['cod','Cash on delivery','Collect the money when the parcel arrives.'],['paid-check','Paid already','Only if you’ve seen the money in your account.']].map(([k,l,s])=>`<button type="button" role="radio" aria-checked="${d.pay===k}" class="trow radio ${d.pay===k?'on':''}" data-act="ai-pay" data-v="${k}"><span class="rdot" aria-hidden="true">${d.pay===k?ic('check','xs'):''}</span><span class="grow"><span class="t">${l}</span><span class="s">${s}</span></span></button>`).join('')}</div></section>
  <details class="card anim src-box" style="--i:6"><summary>${ic('forum','sm')}Compare with the original ${d.hadImages?'screenshots':'conversation'}</summary>
   ${d.excerpts.length?`<p class="label" style="margin:var(--s2) 0 var(--s1)">What Stoora used</p><ul class="quotes">${d.excerpts.map(q=>`<li>“${esc(q)}”</li>`).join('')}</ul>`:''}
   ${d.source?`<p class="label" style="margin:var(--s3) 0 var(--s1)">Full conversation</p><pre class="srctext">${esc(d.source)}</pre>`:`<p class="cap" style="margin-top:var(--s2)">Stoora read your screenshots. They aren’t kept after this page closes.</p>`}</details>
 </div><div>
  <section class="card anim stack" style="--i:7;position:sticky;top:80px" id="ai-sum">${aiSummary(a)}</section>
 </div></div>` }
function aiSummary(a){ const d=a.draft; const iss=draftIssues(d); const sh=toNum(d.ship); const lines=d.items.filter(it=>it.pid&&it.qty); const subtotal=lines.reduce((s,it)=>s+prod(it.pid).price*it.qty,0);
 return `<h2 class="ct">Summary</h2><p class="cap">${ic('edit_note','xs')}Draft · from ${esc(a.src)}</p>
  <div class="kv">${lines.map(it=>`<div class="r"><span>${esc(prod(it.pid).name)}${it.size?' · '+it.size:''} × ${it.qty}</span><span>${rs(prod(it.pid).price*it.qty)}</span></div>`).join('')||'<div class="r"><span>No products confirmed yet</span><span>—</span></div>'}
  <div class="r"><span>Delivery</span><span>${sh?rs(sh):'Free'}</span></div><div class="r t"><span>Total</span><span>${iss.length?'Not ready yet':rs(subtotal+sh)}</span></div></div>
  ${iss.length?`<p class="cap fl">${ic('flag','xs')}Fix ${plural(iss.length,'thing')} above to see the total.</p>`:''}
  <button class="btn primary full" data-act="ai-approve" ${a.busy?'disabled':''}>${a.busy?'<span class="spin"></span>Creating order…':`${ic('check')}Approve and create order`}</button>
  <button class="btn quiet full" data-act="ai-cancel">Cancel draft</button>` }
function approveAI(){ const a=aiState(); if(a.busy) return; const d=a.draft; const iss=draftIssues(d);
 if(iss.length){ render(false); toast(`${plural(iss.length,'thing needs','things need')} your attention first`,null,'error'); const f=$('#'+iss[0].f); f&&f.focus(); return }
 a.busy=true; $('#ai-sum').innerHTML=aiSummary(a);
 setTimeout(()=>{ const o=addOrder({who:d.name,phone:d.phone,items:d.items.map(it=>[it.pid,Number(it.qty),it.size]),pay:d.pay==='paid-check'?'paid':d.pay,src:a.src,ship:toNum(d.ship),notes:d.notes,how:'ai',city:d.city,address:d.address});
  a.busy=false; a.created=o.id; a.stage='done'; ui.dirty=false; render(true); toast('Order created successfully') },400) }

/* ---------- order page: show how an order was made ---------- */
const _orderFn=ARGS['order-']; ARGS['order-']=function(id){ const m=_orderFn(id); const o=ord(id); if(o&&o.how) m.body=m.body.replace('<div class="tl">',`<div class="tl"><div class="ev"><i></i><div><b>${o.how==='ai'?'Prepared by Stoora from a '+esc(o.srcDetail||o.src)+' conversation, approved by you':'Added by you'}</b><span class="cap">${o.notes?esc(o.notes):'No notes'}</span></div></div>`); if(o&&o.items.some(x=>x[2])) o.items.forEach(([p,q,sz])=>{ if(sz) m.body=m.body.replace(`<span class="t">${prod(p).name}</span>`,`<span class="t">${prod(p).name} · ${sz}</span>`) }); return m };

/* ---------- events ---------- */
const _act2=act;
act=function(k,el,e){ const d=el.dataset; const a=ui.ai;
 switch(k){
 case 'ai-act': { const A=ACTIONS[d.a]; if(A){ closeOv(true); if(document.body.classList.contains('docked')&&innerWidth<1280) document.body.classList.remove('docked'); A.run() } return }
 case 'ask-stop': askCtl&&askCtl.abort(); return;
 case 'confirm-yes': { const f=ui._confirm; ui._confirm=null; closeOv(true); f&&f(); return }
 case 'chat-order': { const c=S.chats.find(x=>x.id===d.id); ui.draft={who:c.who,phone:'',items:d.id==='c1'?[['p3',1,'M']]:[],pay:'upi',src:c.src,errors:{}}; ui.dirty=true; return go('create-order-manual') }
 case 'pick-done': { const old=ui.draft.items; ui.draft.items=Object.entries(ui.pick).map(([id,q])=>[id,q,(old.find(x=>x[0]===id)||[])[2]||'']); ui.draft.errors.items=0; ui.dirty=true; closeOv(true); return render(false) }
 case 'discard-leave': ui.ai=null; ui.busy=false; break;
 case 'ai-mode': aiState().mode=d.v; if(d.v!=='file') aiState().files=[]; aiState().fileNote=null; return render(false);
 case 'ai-example': { const s=aiState(); s.text=EXAMPLE_CHAT; s.src='WhatsApp'; ui.dirty=true; render(false); return $('#ai-text')?.focus() }
 case 'ai-run': return runAI();
 case 'ai-stop': aiCtl&&aiCtl.abort(); return;
 case 'ai-new': ui.ai=null; return render(false);
 case 'ai-pay': a.draft.pay=d.v; return render(false);
 case 'ai-additem': a.draft.items.push({said:'Added by you',cands:[],pid:'',size:'',saidSize:'',qty:1}); render(false); return $('#ai-p-'+(a.draft.items.length-1))?.focus();
 case 'ai-rmitem': a.draft.items.splice(+d.i,1); return render(false);
 case 'ai-focus': { const f=$('#'+d.f); if(f){ f.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>f.focus({preventScroll:true}),300) } return }
 case 'ai-approve': return approveAI();
 case 'ai-cancel': return confirmSheet('Cancel this draft?','Nothing will be added to your orders. The chat you added will be cleared.','Cancel draft',()=>{ ui.ai=null; ui.dirty=false; go('orders'); setTimeout(()=>toast('Draft cancelled. No order was created.',null,'info'),50) });
 }
 return _act2(k,el,e) };
openPicker=function(){ if(!/^create-order-manual/.test(route)){ go('create-order-manual','picker'); return }
 ui.pick=Object.fromEntries(ui.draft.items.map(([id,q])=>[id,q]));
 setLayer(sheet('pkr','Add products',`<label class="search" style="margin-bottom:var(--s2)">${ic('search','sm')}<span class="sr">Search products</span><input id="pkr-q" type="search" placeholder="Search products" data-input="pick"></label><div id="pkr-l">${pickerBody()}</div>`,`<div id="pkr-f" style="display:contents">${pickerFoot()}</div>`,{full:innerWidth<760}),'#pkr-q') };
document.addEventListener('submit',e=>{ const f=e.target; if(f.dataset.form==='create2'){ e.preventDefault(); createManual() } });
document.addEventListener('input',e=>{ const t=e.target; const a=ui.ai;
 if(t.dataset.draft==='ship'||t.dataset.draft==='notes'){ ui.draft[t.dataset.draft]=t.value; ui.dirty=true; const s=$('#co-sum'); if(s) s.innerHTML=manualSummary(); return }
 if(t.dataset.ai){ aiState()[t.dataset.ai]=t.value; if(t.dataset.ai==='text') ui.dirty=!!t.value.trim(); return }
 if(t.dataset.aid&&a&&a.draft){ a.draft[t.dataset.aid]=t.value; $('#ai-sum').innerHTML=aiSummary(a); t.classList.toggle('flag',!t.value.trim()&&['name','city','address'].includes(t.dataset.aid)); return }
 if(t.dataset.aitem!==undefined&&t.dataset.k==='qty'&&a&&a.draft){ const v=parseInt(t.value,10); a.draft.items[+t.dataset.aitem].qty=v>0?v:''; $('#ai-sum').innerHTML=aiSummary(a); return } });
document.addEventListener('change',e=>{ const t=e.target; const a=ui.ai;
 if(t.dataset.cosize!==undefined){ const it=ui.draft.items[+t.dataset.cosize]; it[2]=t.value; delete ui.draft.errors['size'+t.dataset.cosize]; t.classList.remove('bad'); const s=$('#co-sum'); if(s) s.innerHTML=manualSummary(); return }
 if(t.dataset.ai==='src'){ aiState().src=t.value; return }
 if(t.id==='ai-file'){ takeFiles(t.files); return }
 if(t.dataset.aitem!==undefined&&a&&a.draft){ const it=a.draft.items[+t.dataset.aitem]; if(t.dataset.k==='pid'){ it.pid=t.value; const P=it.pid&&prod(it.pid); it.size=P&&P.sizes&&P.sizes.includes(it.saidSize)?it.saidSize:'' } else if(t.dataset.k==='size') it.size=t.value; render(false) } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='home-q'){ e.preventDefault(); e.target.form.requestSubmit() } });

/* ---------- boot ---------- */
render(true);

</script>

</body></html>
