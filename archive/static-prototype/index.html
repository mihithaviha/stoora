<style>
/* Layout: one responsive app. Phone (<760): sticky top bar + floating bottom bar. Tablet (760-1099): ink icon rail. Desktop (1100+): ink sidebar, white work panel, Ask Stoora docks right at 1280+.
   Single light look by design: Brand Kit v2 defines one palette (white page, grey cards, cream inside cards). */
:root{
  /* Brand Kit v2 — copied from AGENTS.md §1, never by eye */
  --surface:#FFFFFF; --card:#F7F7F7; --inner:#FFFAEF; --muted:#F2EADD; --line:#E0D6CA; --line-soft:#EBE3DA;
  --ink:#171C3C; --ink-soft:#303652; --ink-65:#725F54; --ink-45:#938378;
  --primary:#EA5B1E; --marigold:#FFB407; --positive:#0FA05C; --negative:#DE3C37;
  --primary-deep:#9A3412; --primary-tint:#FFE4D3; --marigold-deep:#6E4A00; --marigold-tint:#FFE9B0;
  --positive-deep:#065F37; --positive-tint:#DCEFDF; --negative-deep:#951F27; --negative-tint:#F8D6D5;
  --gradient-warm:linear-gradient(135deg,#fbe0a8 0%,#f4a24a 14%,#ef7f3d 28%,#dc4a3a 42%,#d13a5b 56%,#8b3a9e 70%,#5f3ba8 84%,#262a7a 100%);
  --gradient-action:linear-gradient(90deg,#ffb347 0%,#ff6b2c 55%,#c13fa8 100%);
  --gradient-soft:linear-gradient(180deg,#FFFAEF 0%,#FFEFD5 100%);
  --seg-shop-a:#f4a24a; --seg-pay-a:#ef7f3d; --seg-chat-a:#d13a5b; --seg-reel-a:#5f3ba8;
  /* text on the indigo sidebar/drawer: white, and white mixed into ink (no new hue) */
  --on-ink:#FFFFFF; --on-ink-soft:color-mix(in srgb,#FFFFFF 74%,#171C3C); --on-ink-faint:color-mix(in srgb,#FFFFFF 12%,#171C3C); --on-ink-line:color-mix(in srgb,#FFFFFF 16%,#171C3C);
  --scrim:color-mix(in srgb,#171C3C 48%,transparent);

  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-logo:"Fraunces",ui-serif,Georgia,serif;

  /* φ spacing only: 6 10 16 26 42 68 */
  --s1:.375rem; --s2:.625rem; --s3:1rem; --s4:1.625rem; --s5:2.625rem; --s6:4.25rem;
  --r-md:.375rem; --r-lg:.5rem; --r-xl:.75rem; --r-2xl:1rem; --pill:50px;

  --shadow-soft:0 4px 16px -10px oklch(40% .08 40/.14);
  --shadow-warm:0 18px 40px -24px oklch(40% .1 40/.28);
  --shadow-pill:0 1px 2px -1px oklch(30% .08 40/.1),0 8px 20px -8px oklch(30% .08 40/.1);
  --shadow-float:0 0 0 1px oklch(40% .06 40/.08),0 14px 34px -14px oklch(40% .1 40/.34);
  --ring:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent);
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.36,.64,1);
  --tap:44px; --side:248px; --rail:84px; --ask:392px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink-65);font-family:var(--font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
a{color:var(--primary-deep);text-underline-offset:3px}
h1,h2,h3,h4{margin:0;color:var(--ink);text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;flex:none;width:1em;overflow:hidden}
.ms.sm{font-size:20px} .ms.xs{font-size:18px} .ms.lg{font-size:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- type ---------- */
.h1{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.025em;color:var(--ink)}
.h2{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
.ct{font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.01em;color:var(--ink)}
.t-ink{color:var(--ink)} .t-soft{color:var(--ink-soft)} .t-body{color:var(--ink-65)} .t-cap{color:var(--ink-45)}
.cap{font-size:13px;line-height:1.45;color:var(--ink-65)}
.cap.faint{color:var(--ink-45)}
.eyebrow{font-size:11px;line-height:1;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--gradient-action);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;max-width:100%}
.label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-65)}
.em{font-style:normal;background:var(--gradient-action);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.link{color:var(--primary-deep);font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:2px;min-height:var(--tap);padding:0 var(--s1);margin:0 calc(var(--s1) * -1);border-radius:var(--pill)}
.link:hover{text-decoration:underline}

/* ---------- app shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.side{display:none}
.main{min-width:0;background:var(--surface);position:relative}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(128px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto}
.page.narrow{max-width:820px}
.wordmark{font-family:var(--font-logo);font-weight:900;letter-spacing:-.03em;font-size:22px;line-height:1;color:var(--ink);font-variation-settings:"opsz" 72}
.wordmark i{font-style:normal;color:var(--primary)}
.appicon{width:34px;height:34px;border-radius:10px;background:var(--gradient-warm);display:grid;place-items:center;color:#FFFFFF;font-family:var(--font-display);font-weight:800;font-size:19px;flex:none;letter-spacing:-.02em}
.smark{width:30px;height:30px;border-radius:50%;background:var(--gradient-warm);display:grid;place-items:center;color:#FFFFFF;font-family:var(--font-display);font-weight:800;font-size:16px;flex:none}
.smark.xs{width:22px;height:22px;font-size:12px}

/* phone top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:var(--s2);min-height:64px;padding-block:var(--s2);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:16px;color:var(--ink)}
.top .ttl span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acts{display:flex;gap:var(--s1);align-items:center}
.ibtn{width:var(--tap);height:var(--tap);border-radius:var(--pill);display:grid;place-items:center;flex:none;position:relative;color:var(--ink-soft);background:var(--surface);box-shadow:var(--shadow-pill);border:1px solid var(--line-soft);transition:transform .2s var(--spring),background .15s}
.ibtn:hover{background:var(--card)}
.ibtn:active{transform:scale(.94)}
.ibtn.flat{box-shadow:none;border-color:transparent;background:transparent}
.ibtn.flat:hover{background:var(--muted)}
.dotn{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--negative);color:#FFFFFF;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:1;box-shadow:0 0 0 2px var(--surface)}
.shop-av{width:40px;height:40px;border-radius:12px;background:var(--gradient-warm);display:grid;place-items:center;color:#FFFFFF;font-family:var(--font-display);font-weight:800;font-size:18px;flex:none}

/* page head (desktop + phone) */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s2) 0 var(--s4)}
.phead .l{display:grid;gap:var(--s1);min-width:0}
.phead .r{display:flex;gap:var(--s2);flex-wrap:wrap}
.phead.d-only{display:none}

/* floating bottom bar */
.bbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(var(--s2) + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:var(--s1);transition:transform .3s var(--ease-out),opacity .3s}
.bbar .round{width:56px;height:56px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-float);display:grid;place-items:center;flex:none;color:var(--ink-soft);transition:transform .2s var(--spring)}
.bbar .round:active{transform:scale(.94)}
.bbar .pill{flex:1;min-width:0;height:60px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-float);display:flex;padding:5px;gap:2px}
.bbar .pill a{flex:1;min-width:0;border-radius:var(--pill);display:grid;place-items:center;align-content:center;gap:1px;color:var(--ink-65);font-size:12px;font-weight:500;line-height:14px;text-decoration:none;position:relative;transition:background .2s var(--ease),color .2s}
.bbar .pill a .ms{font-size:22px}
.bbar .pill a.on{background:var(--muted);color:var(--ink)}
.bbar .pill a .bd{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--surface)}
.bbar.hide{transform:translateY(140%);opacity:0;pointer-events:none}

/* desktop sidebar */
.side-in{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s2) var(--s3);overflow-y:auto;scrollbar-width:none;color:var(--on-ink-soft)}
.brand{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s3);color:var(--on-ink);text-decoration:none}
.brand .wordmark{color:var(--on-ink);font-size:23px}
.sbtn-search{display:flex;align-items:center;gap:var(--s2);height:var(--tap);border-radius:var(--pill);background:var(--on-ink-faint);color:var(--on-ink-soft);padding:0 var(--s3);margin-bottom:var(--s2);font-size:14px;width:100%;text-align:left;border:1px solid var(--on-ink-line)}
.sbtn-search kbd{margin-left:auto;font:500 11px var(--font-sans);border:1px solid var(--on-ink-line);border-radius:var(--r-md);padding:2px 6px}
.nav{display:flex;align-items:center;gap:var(--s2);height:var(--tap);padding:0 var(--s3) 0 var(--s2);border-radius:var(--pill);color:var(--on-ink-soft);text-decoration:none;font-size:15px;font-weight:400;transition:background .15s,color .15s}
.nav:hover{background:var(--on-ink-faint);color:var(--on-ink)}
.nav.on{background:var(--on-ink-faint);color:var(--on-ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--on-ink-line)}
.nav .ms{font-size:21px}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--on-ink-line);color:var(--on-ink);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav .cnt.hot{background:var(--primary);color:#FFFFFF}
.nav.sub{height:36px;padding-left:46px;font-size:14px}
.ngroup{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--on-ink-soft);opacity:.8;margin:var(--s3) var(--s2) var(--s1)}
.side-foot{margin-top:auto;display:grid;gap:2px;padding-top:var(--s2)}
.shopbtn{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2);border-radius:var(--pill);color:var(--on-ink);min-height:52px;text-align:left;width:100%}
.shopbtn:hover{background:var(--on-ink-faint)}
.shopbtn .shop-av{width:34px;height:34px;border-radius:10px;font-size:15px}
.shopbtn b{font-weight:500;font-size:14px;display:block;line-height:1.3}
.shopbtn small{font-size:12px;color:var(--on-ink-soft);display:block;line-height:1.3}

/* desktop header bar inside the work panel */
.dbar{display:none}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s3);box-shadow:var(--shadow-soft);min-width:0}
.card.pad-lg{padding:var(--s4)}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3);min-height:28px}
.card-h .ct{display:flex;align-items:center;gap:var(--s1)}
.card-h .ct .ms{font-size:20px;color:var(--ink-soft)}
.inner{background:var(--inner);border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:var(--s2) var(--s3)}
.stack{display:grid;gap:var(--s3);min-width:0}
.stack.tight{gap:var(--s2)}
.stack.loose{gap:var(--s4)}
.row{display:flex;align-items:center;gap:var(--s2);min-width:0}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line-soft);margin:var(--s3) 0;border:0}
.grid2{display:grid;gap:var(--s3);grid-template-columns:1fr}

/* ---------- buttons (R4: anything clickable is a pill) ---------- */
.btn{height:var(--tap);padding:0 var(--s4);border-radius:var(--pill);font-weight:500;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);white-space:nowrap;transition:filter .2s var(--ease),transform .2s var(--spring),background .15s,box-shadow .2s;text-decoration:none;flex:none}
.btn .ms{font-size:20px;margin-left:-4px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gradient-action);color:#FFFFFF;box-shadow:0 6px 16px -8px oklch(55% .2 40/.6)}
.btn.ink{background:var(--ink);color:#FFFFFF}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.card .btn.line,.sheet .btn.line{background:var(--inner)}
.btn.quiet{color:var(--ink-soft);padding:0 var(--s3)}
.btn.quiet:hover{background:var(--muted);filter:none}
.btn.danger{color:var(--negative-deep);padding:0 var(--s3)}
.btn.danger:hover{background:var(--negative-tint);filter:none}
.btn.sm{height:36px;padding:0 var(--s3);font-size:14px}
.btn.full{width:100%}
.btn[disabled]{cursor:not-allowed;background:var(--muted);color:var(--ink-65);box-shadow:none;filter:none}
.btns{display:flex;gap:var(--s2);flex-wrap:wrap}

/* badges: deep text on tint + icon + word (R6) */
.bdg{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 var(--s2) 0 7px;border-radius:var(--pill);font-size:13px;font-weight:500;white-space:nowrap;line-height:1}
.bdg .ms{font-size:16px}
.bdg.ok{background:var(--positive-tint);color:var(--positive-deep)}
.bdg.warn{background:var(--marigold-tint);color:var(--marigold-deep)}
.bdg.bad{background:var(--negative-tint);color:var(--negative-deep)}
.bdg.offer{background:var(--primary-tint);color:var(--primary-deep)}
.bdg.neutral{background:var(--muted);color:var(--ink-soft)}
.src{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 var(--s2) 0 7px;border-radius:var(--pill);font-size:13px;color:var(--ink-soft);border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.src .ms{font-size:16px}

/* chips, segmented */
.chips{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 var(--s3);border-radius:var(--pill);background:var(--inner);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-soft);display:inline-flex;align-items:center;gap:var(--s1);transition:background .15s,transform .15s var(--spring)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.chip .n{min-width:20px;height:20px;border-radius:10px;background:var(--muted);color:var(--ink);font-size:12px;display:grid;place-items:center;padding:0 6px}
.chip.on .n{background:color-mix(in srgb,#FFFFFF 22%,var(--ink));color:#FFFFFF}
.seg{display:flex;background:var(--muted);border-radius:var(--pill);padding:4px;gap:2px}
.seg button{flex:1;height:38px;border-radius:var(--pill);font-size:14px;font-weight:500;color:var(--ink-65);padding:0 var(--s3);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:var(--s1)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pill)}
.seg button .n{font-size:12px;min-width:20px;height:20px;border-radius:10px;background:var(--card);display:grid;place-items:center;padding:0 5px;color:var(--ink-soft)}
.seg.inline{display:inline-flex}

/* inputs (pills; textareas are containers) */
.field{display:grid;gap:var(--s1)}
.field>label,.flabel{font-size:14px;font-weight:500;color:var(--ink)}
.field .hint{font-size:13px;color:var(--ink-65)}
.field .err{font-size:14px;color:var(--negative-deep);display:flex;gap:4px;align-items:center}
.input{height:48px;border:1px solid var(--line);background:var(--inner);border-radius:var(--pill);padding:0 var(--s4) 0 18px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
.input::placeholder,.askbox textarea::placeholder{color:var(--ink-45)}
.input:focus,.affix:focus-within{border-color:var(--primary);box-shadow:var(--ring)}
.input.bad,.affix.bad{border-color:var(--negative)}
textarea.input{height:auto;min-height:104px;border-radius:var(--r-2xl);padding:var(--s2) 18px;resize:vertical;line-height:1.5}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 16px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.affix{display:flex;align-items:center;border:1px solid var(--line);background:var(--inner);border-radius:var(--pill);padding-left:18px;transition:border-color .15s,box-shadow .15s}
.affix span{color:var(--ink-soft);font-weight:500}
.affix input{border:0;background:none;height:46px;flex:1;min-width:0;outline:none;padding:0 18px 0 var(--s1)}
.search{display:flex;align-items:center;gap:var(--s1);height:44px;border:1px solid var(--line);background:var(--inner);border-radius:var(--pill);padding:0 var(--s3);color:var(--ink-65);flex:1;min-width:0}

.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);overflow:hidden;height:40px}

/* ---------- lists ---------- */
.rows{display:grid;gap:var(--s1)}
.li{display:flex;gap:var(--s2);padding:var(--s2) var(--s3);background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-xl);text-align:left;width:100%;align-items:center;color:inherit;text-decoration:none;min-height:64px;transition:background .15s,border-color .15s,box-shadow .2s}
a.li:hover,button.li:hover{border-color:var(--line);box-shadow:var(--shadow-soft);background:color-mix(in srgb,var(--inner) 50%,var(--card))}
.li .t{font-weight:500;color:var(--ink);display:block;line-height:1.35}
.li .s{font-size:13px;color:var(--ink-65);display:block;line-height:1.45}
.li .end{display:grid;justify-items:end;gap:4px;flex:none}

.av.c1{background:var(--primary-tint);color:var(--primary-deep)} .av.c2{background:var(--marigold-tint);color:var(--marigold-deep)} .av.c3{background:var(--positive-tint);color:var(--positive-deep)} .av.c4{background:var(--negative-tint);color:var(--negative-deep)}

/* table (desktop) */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-2xl);background:var(--card);box-shadow:var(--shadow-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.tbl th{text-align:left;font-weight:500;font-size:13px;color:var(--ink-65);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-soft);color:var(--ink-soft);white-space:nowrap;height:58px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--inner)}
.tbl .r{text-align:right}
.tbl b{font-weight:600;color:var(--ink)}
.only-wide{display:none}

/* ---------- home ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.tile{background:var(--inner);border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:var(--s2) var(--s3) var(--s3);text-align:left;display:grid;gap:4px;color:inherit;text-decoration:none;transition:box-shadow .2s,border-color .2s,transform .2s var(--ease)}
a.tile:hover,button.tile:hover{border-color:var(--line);box-shadow:var(--shadow-soft)}
.tile .k{font-size:13px;color:var(--ink-65)}
.tile .v{font-size:28px}
.tile .d{font-size:13px;color:var(--ink-65);display:flex;align-items:center;gap:2px}
.tile .d.up{color:var(--positive-deep)} .tile .d.down{color:var(--negative-deep)}
.tile .d .ms{font-size:16px}
.greet{display:grid;gap:var(--s1)}
.live{display:inline-flex;align-items:center;gap:var(--s1);font-size:13px;color:var(--ink-soft)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--positive);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--positive) 50%,transparent)}70%,100%{box-shadow:0 0 0 7px color-mix(in srgb,var(--positive) 0%,transparent)}}
.askbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s2) var(--s2) var(--s1) var(--s3);transition:border-color .2s,box-shadow .2s}
.askbox:focus-within{border-color:var(--primary);box-shadow:var(--ring)}
.askbox textarea{width:100%;border:0;background:none;outline:none;resize:none;line-height:1.5;min-height:48px;padding-top:4px;font-family:var(--font-sans)}
.askbox .tools{display:flex;align-items:center;gap:var(--s1)}
.go{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.go:active{transform:scale(.92)}
.go[disabled]{background:var(--muted);color:var(--ink-65)}
.sugg{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding:2px;margin:var(--s2) -2px 0}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;height:38px;padding:0 var(--s3);border-radius:var(--pill);border:1px solid var(--line);background:var(--inner);color:var(--ink-soft);font-size:14px;transition:background .15s,border-color .15s}
.sugg button:hover{background:var(--surface);border-color:var(--ink-45)}
.morning{border-color:var(--line);background:var(--card)}
.idea{background:var(--inner);border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:var(--s3);display:grid;gap:var(--s2);transition:opacity .3s,transform .3s var(--ease-out)}
.idea p{color:var(--ink-soft)}
.idea.out{opacity:0;transform:translateX(16px)}
.earn{display:flex;gap:var(--s1);flex-wrap:wrap}
.todo{display:grid;gap:var(--s1)}
.trow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2) var(--s2) var(--s2);border:1px solid var(--line-soft);border-radius:var(--r-xl);background:var(--inner);text-align:left;width:100%;color:inherit;text-decoration:none;min-height:60px;transition:background .15s,box-shadow .2s,border-color .15s}
.trow:hover{background:var(--surface);box-shadow:var(--shadow-soft);border-color:var(--line)}
.trow .ic{width:40px;height:40px;border-radius:var(--r-xl);display:grid;place-items:center;flex:none}
.ic.shop{background:color-mix(in srgb,var(--seg-shop-a) 18%,var(--surface));color:var(--primary-deep)}
.ic.pay{background:var(--marigold-tint);color:var(--marigold-deep)}
.ic.chat{background:color-mix(in srgb,var(--seg-chat-a) 13%,var(--surface));color:var(--negative-deep)}
.ic.reel{background:color-mix(in srgb,var(--seg-reel-a) 13%,var(--surface));color:var(--seg-reel-a)}
.trow .t{font-weight:500;color:var(--ink);display:block;line-height:1.35}
.trow .s{font-size:13px;color:var(--ink-65);display:block}
.trow .n{min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#FFFFFF;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 8px}
.meter{height:8px;border-radius:var(--pill);background:var(--muted);overflow:hidden}
.meter i{display:block;height:100%;background:var(--positive);border-radius:var(--pill)}
.setupgrid{display:grid;gap:var(--s3);grid-template-columns:1fr}
.setup{padding:0;overflow:hidden;display:flex;flex-direction:column}
.setup .art{height:132px;background:var(--gradient-soft);display:grid;place-items:center;position:relative;margin:var(--s1);border-radius:var(--r-xl)}
.setup .x{position:absolute;top:var(--s1);right:var(--s1)}
.setup .body{padding:var(--s1) var(--s3) var(--s3);display:grid;gap:var(--s1);flex:1;align-content:start}
.setup .body .btn{justify-self:start;margin-top:var(--s1)}
.setup.done .art{opacity:.6}

/* bars chart */
.chart{position:relative}
.bars{display:flex;align-items:flex-end;gap:var(--s1);height:150px;padding-top:var(--s2);border-bottom:1px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.bars .b i{display:block;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;transition:background .15s}
.bars .b.prev i{background:var(--line)}
.bars .b:hover i,.bars .b:focus-visible i{background:var(--primary-deep)}
.bars .b.prev:hover i{background:var(--ink-45)}
.xlab{display:flex;gap:var(--s1);margin-top:var(--s1)}
.xlab span{flex:1;text-align:center;font-size:12px;color:var(--ink-65)}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;font-size:12px;padding:4px var(--s1);border-radius:var(--r-md);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}

.hbar{display:grid;gap:4px}
.hbar .top2{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft)}
.hbar .trk{height:10px;border-radius:var(--pill);background:var(--muted);overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--primary);border-radius:var(--pill)}
.spark{display:block}

/* chat */
.chatwrap{display:grid;gap:var(--s3);grid-template-columns:1fr}
.thread{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s3)}
.bubble{max-width:82%;padding:var(--s2) var(--s3);border-radius:var(--r-2xl);font-size:15px;line-height:1.5;color:var(--ink-soft)}
.bubble.them{background:var(--surface);border:1px solid var(--line-soft);border-top-left-radius:var(--r-md);align-self:flex-start}
.bubble.me{background:var(--positive-tint);color:var(--positive-deep);border-top-right-radius:var(--r-md);align-self:flex-end}

.draft textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);padding:var(--s2);resize:vertical;min-height:96px;outline:none;line-height:1.5}
.draft textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
.composer{display:flex;gap:var(--s1);align-items:center;padding:var(--s2) var(--s3) var(--s3);border-top:1px solid var(--line-soft)}

.tl{display:grid;gap:var(--s3);position:relative}

.tl .ev b{font-weight:500;color:var(--ink);display:block}
.kv{display:grid;gap:var(--s1)}
.kv .r{display:flex;justify-content:space-between;gap:var(--s3);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.kv .r.t{font-weight:600;color:var(--ink);font-size:16px;padding-top:var(--s1);border-top:1px solid var(--line-soft)}
.banner{display:flex;gap:var(--s2);align-items:flex-start;border-radius:var(--r-xl);padding:var(--s2) var(--s3);font-size:14px;line-height:1.5}
.banner .ms{font-size:20px;margin-top:1px}
.banner.warn{background:var(--marigold-tint);color:var(--marigold-deep)}
.banner.bad{background:var(--negative-tint);color:var(--negative-deep)}
.banner.ok{background:var(--positive-tint);color:var(--positive-deep)}
.banner.info{background:var(--inner);color:var(--ink-soft);border:1px solid var(--line)}

/* settings */
.setlist{display:grid}
.set-row{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:0 var(--s3);border-top:1px solid var(--line-soft);width:100%;text-align:left;font-size:15px;color:var(--ink);text-decoration:none;transition:background .15s}
.set-row:first-child{border-top:0}
.set-row:hover{background:var(--inner)}
.set-row .ms{color:var(--ink-soft)}
.set-row .ms:last-child{margin-left:auto;color:var(--ink-45)}
.toggle-row{display:flex;align-items:center;gap:var(--s3);min-height:60px;padding:var(--s1) 0;border-top:1px solid var(--line-soft)}
.toggle-row:first-of-type{border-top:0}

/* empty state */
.empty{display:grid;justify-items:center;text-align:center;gap:var(--s2);padding:var(--s4) var(--s3)}
.empty p{max-width:34ch}

/* save bar (unsaved changes) */
.savebar{position:fixed;left:0;right:0;top:0;z-index:45;display:flex;align-items:center;gap:var(--s2);padding:calc(var(--s2) + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) var(--s2) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:#FFFFFF;animation:dropin .35s var(--ease-out)}
.savebar .msg{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s1);font-weight:500}
.savebar .btn.line{background:transparent;color:#FFFFFF;border-color:var(--on-ink-line)}
.savebar .btn.save{background:#FFFFFF;color:var(--ink)}
@keyframes dropin{from{transform:translateY(-100%)}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .25s var(--ease)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:92dvh;display:flex;flex-direction:column;animation:up .35s var(--ease-out);box-shadow:var(--shadow-warm)}
.sheet.full{top:0;max-height:none;border-radius:0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:var(--s1) auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) max(16px,env(safe-area-inset-right,0px)) var(--s2) max(16px,env(safe-area-inset-left,0px));min-height:64px;flex:none}
.sheet.full .sheet-h{padding-top:calc(var(--s2) + env(safe-area-inset-top,0px))}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) var(--s3) max(16px,env(safe-area-inset-left,0px));flex:1;min-height:0;overscroll-behavior:contain}
.sheet-f{display:flex;gap:var(--s2);padding:var(--s2) max(16px,env(safe-area-inset-right,0px)) calc(var(--s3) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line-soft);flex:none;background:var(--surface)}
.sheet-f .btn{flex:1}
.drawer{position:fixed;inset:0;z-index:52;background:var(--ink);color:var(--on-ink);animation:fade .2s;display:flex}
.drawer .panel{width:min(86%,360px);padding:calc(var(--s3) + env(safe-area-inset-top,0px)) var(--s2) calc(var(--s3) + env(safe-area-inset-bottom,0px)) max(var(--s2),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;overflow-y:auto;animation:slide .35s var(--ease-out)}
.drawer .peek{flex:1;margin:var(--s6) 0 var(--s6) var(--s2);background:var(--surface);border-radius:28px 0 0 28px;opacity:.92;animation:peek .35s var(--ease-out)}
.drawer .nav{height:50px;font-size:17px}
.drawer .foot{margin-top:auto;padding-top:var(--s3);display:flex;gap:var(--s2)}
.drawer .foot .btn{background:var(--on-ink-faint);color:var(--on-ink);border:1px solid var(--on-ink-line)}
.pop{position:fixed;z-index:51;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow-warm);overflow:hidden;animation:fade .2s;display:flex;flex-direction:column;max-height:min(560px,80dvh)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#FFFFFF;border-radius:var(--pill);padding:0 var(--s1) 0 var(--s3);min-height:48px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:var(--s2);box-shadow:var(--shadow-warm);animation:toastin .4s var(--spring);max-width:calc(100% - 32px)}
.toast .ms{color:var(--positive-tint);font-size:20px}
.toast span{padding:var(--s2) 0}
.toast button{height:36px;padding:0 var(--s3);border-radius:var(--pill);color:var(--marigold-tint);font-weight:600}
.toast button:hover{background:var(--on-ink-faint)}
.toast:not(:has(button)){padding-right:var(--s3)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes slide{from{transform:translateX(-100%)}}
@keyframes peek{from{transform:translateX(-30%);opacity:0}}

/* ask stoora */
.askpanel{display:flex;flex-direction:column;height:100%;min-height:0}
.ans{display:grid;gap:var(--s2)}
.qbubble{align-self:flex-end;justify-self:end;background:var(--ink);color:#FFFFFF;border-radius:var(--r-2xl);border-top-right-radius:var(--r-md);padding:var(--s2) var(--s3);max-width:85%}
.abox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s3);display:grid;gap:var(--s2)}
.abox .who{display:flex;align-items:center;gap:var(--s1);font-size:13px;font-weight:500;color:var(--primary-deep)}
.typing{display:inline-flex;gap:4px;padding:var(--s2) 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-45);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

.askdock{display:none}

/* storefront preview */
.shopprev{border:8px solid var(--ink);border-radius:28px;background:var(--surface);overflow:hidden;max-width:300px;margin:0 auto;box-shadow:var(--shadow-warm)}
.shopprev .hd{padding:var(--s3);display:grid;gap:4px;justify-items:center;text-align:center;background:var(--gradient-soft)}
.shopprev .gridp{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1);padding:var(--s2)}
.shopprev .gridp div{background:var(--card);border-radius:var(--r-xl);padding:var(--s1);font-size:12px;color:var(--ink-soft);display:grid;gap:4px}
.shopprev .gridp .ph{height:64px;border-radius:var(--r-lg);background:var(--inner);display:grid;place-items:center;color:var(--ink-soft)}

/* design system page */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.sw div{border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;font-size:12px;background:var(--surface)}

.notes li{margin-bottom:var(--s1);color:var(--ink-soft)}

/* ---------- motion: only when a screen arrives ---------- */
@keyframes rise{from{opacity:.001;transform:translateY(10px)}}
@keyframes popin{from{opacity:.001;transform:scale(.85)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fillw{from{transform:scaleX(0)}}
@keyframes drawl{to{stroke-dashoffset:0}}

/* ================= PUBLIC SITE + AUTH =================
   Layout: editorial, asymmetric 12-col compositions on a white page. One bold place per section; the
   painted-sign shopfront is the recurring motif (hero → final CTA). Gradient only on the CTA, the handle ring, eyebrows. */
:root{--s7:6.875rem;--s8:11.125rem;--nav:72px}
body:not(.mode-app) .app,body:not(.mode-app) #bbar,body:not(.mode-app) #savez{display:none}
body:not(.mode-public) #site{display:none}
body:not(.mode-auth) #auth{display:none}
body.mode-public,body.mode-auth{background:var(--surface)}
body.mode-public::before,body.mode-auth::before{background:var(--surface)}
@media (min-width:760px){body:not(.mode-app){background:var(--surface)} body:not(.mode-app)::before{background:var(--surface)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,1,.36,1)}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(var(--s5),env(safe-area-inset-left,0px));padding-right:max(var(--s5),env(safe-area-inset-right,0px))}}
.sec{padding-block:var(--s6);scroll-margin-top:calc(var(--nav) + 10px)}
@media (min-width:960px){.sec{padding-block:var(--s7)}}
.l-h2{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4.2vw,42px);line-height:1.1;letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.l-h3{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,2.4vw,28px);line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
.lede{font-size:clamp(16px,1.5vw,18px);line-height:1.6;color:var(--ink-65);max-width:58ch}
.sec-open{display:grid;gap:var(--s2);margin-bottom:var(--s5);max-width:760px}
.status{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 var(--s2) 0 7px;border-radius:var(--pill);font-size:13px;font-weight:500;white-space:nowrap}
.status .ms{font-size:16px}
.status.live{background:var(--positive-tint);color:var(--positive-deep)}
.status.early{background:var(--primary-tint);color:var(--primary-deep)}
.status.later{background:var(--muted);color:var(--ink-soft)}

/* ---------- nav ---------- */
.lnav{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background .3s var(--ease),box-shadow .3s var(--ease),backdrop-filter .3s}
.lnav.solid{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line-soft)}
.lnav .in{height:var(--nav);display:flex;align-items:center;gap:var(--s3)}
.lnav .logo{display:flex;align-items:center;gap:var(--s2);text-decoration:none;flex:none}
.lnav .logo .appicon{width:32px;height:32px;font-size:18px}
.lnav .links{display:none;position:relative;margin:0 auto;padding:4px;border-radius:var(--pill);background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line-soft)}
.lnav .links button{position:relative;z-index:1;height:38px;padding:0 var(--s3);border-radius:var(--pill);font-size:14px;color:var(--ink-soft);transition:color .2s}
.lnav .links button:hover,.lnav .links button.on{color:var(--ink)}
.lnav .ind{position:absolute;top:4px;height:38px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--shadow-pill);transition:transform .35s var(--ease-out),width .35s var(--ease-out),opacity .2s;opacity:0;z-index:0;left:0}
.lnav .acts{display:flex;align-items:center;gap:var(--s1);margin-left:auto}

@media (min-width:980px){.lnav .links{display:flex}.lnav .acts{margin-left:0}.lnav .acts .login{display:inline-flex}.lnav .menu-btn{display:none}}
.mnav{position:fixed;inset:0;z-index:60;background:var(--surface);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + var(--s2)) max(16px,env(safe-area-inset-right,0px)) calc(var(--s4) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
.mnav .hd{display:flex;align-items:center;height:56px}
.mnav nav{display:grid;margin-top:var(--s4)}
.mnav nav button{text-align:left;font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:-.02em;color:var(--ink);min-height:64px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;animation:rise .45s var(--ease-out) both;animation-delay:calc(var(--i) * 50ms)}
.mnav .ft{margin-top:auto;display:grid;gap:var(--s2)}

/* ---------- hero ---------- */
.hero{padding-top:calc(var(--nav) + var(--s5));padding-bottom:var(--s6);position:relative;overflow:clip}
.hero .grid{display:grid;gap:var(--s5);align-items:center}
@media (min-width:980px){.hero{padding-top:calc(var(--nav) + var(--s6));min-height:min(900px,100svh)}.hero .grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s4)}}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6.2vw,62px);line-height:1.02;letter-spacing:-.035em;color:var(--ink);margin:var(--s3) 0 var(--s3)}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln>span{display:inline-block}
.hero .lede{margin-bottom:var(--s4)}
.claim{display:flex;align-items:center;max-width:520px;border-radius:var(--pill);padding:2px;background:var(--gradient-action);box-shadow:0 14px 30px -18px oklch(55% .2 40/.55)}
.claim .box{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface);border-radius:var(--pill);height:56px;padding-left:var(--s4)}
.claim .pre{color:var(--ink-soft);font-weight:500;white-space:nowrap}
.claim input{border:0;outline:none;background:none;flex:1;min-width:0;height:100%;font-weight:500;color:var(--ink);padding:0 var(--s1) 0 1px}

.claim .btn{height:46px;margin-right:5px}
.claim:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent),0 14px 30px -18px oklch(55% .2 40/.55)}
@media (max-width:479px){.claim{flex-direction:column;background:none;box-shadow:none;padding:0;gap:var(--s2);max-width:none}.claim .box{width:100%;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--gradient-action) border-box}.claim .btn{width:100%;margin:0;height:50px}.claim .box{flex:none;height:56px}}
.hero .sub{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-top:var(--s3)}
.hero .admit{font-size:13px;color:var(--ink-65);display:flex;gap:var(--s1);align-items:center}
.hero .admit i{width:8px;height:8px;border-radius:50%;background:var(--marigold);flex:none}
.stage{position:relative;aspect-ratio:1/1.02;max-width:560px;width:100%;margin:0 auto}
.stage .shop{position:absolute;right:0;top:0;width:76%;max-width:100%}
.stage .shop svg{width:100%;height:auto;display:block}
.stage .phone{position:absolute;left:0;bottom:0;width:min(240px,44%)}
.stage .float{position:absolute;z-index:3;transition:transform .5s var(--ease-out)}
.stage .cap2{position:absolute;right:0;bottom:-6px;font-size:12px;color:var(--ink-65)}
.layer{will-change:transform;transition:transform .6s var(--ease-out)}

/* device */
.dev{background:var(--ink);border-radius:34px;padding:7px;box-shadow:var(--shadow-warm),0 30px 60px -30px oklch(30% .08 40/.45);position:relative;z-index:2}
.dev .scr{background:var(--surface);border-radius:28px;overflow:hidden;aspect-ratio:9/18.5;position:relative;font-size:12px}
.dev .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:34%;height:18px;border-radius:12px;background:var(--ink);z-index:3}
.scene{position:absolute;inset:0;padding:38px 12px 12px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease-out);pointer-events:none}
.scene.on{opacity:1;transform:none}
.scene .hd{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:13px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.scene .bub{background:var(--card);border:1px solid var(--line-soft);border-radius:14px 14px 14px 4px;padding:8px 10px;color:var(--ink-soft);line-height:1.4;max-width:88%}
.scene .mine{background:var(--positive-tint);color:var(--positive-deep);border-radius:14px 14px 4px 14px;align-self:flex-end;border:0}
.scene .mini{background:var(--inner);border:1px solid var(--line-soft);border-radius:12px;padding:8px 10px;display:grid;gap:6px;color:var(--ink-soft);line-height:1.4}
.scene .mini b{color:var(--ink);font-weight:600}
.scene .bdg,.scene .src{height:22px;font-size:11px;padding:0 8px 0 6px}
.scene .bdg .ms,.scene .src .ms{font-size:14px}
.scene .sbtn{height:30px;border-radius:var(--pill);background:var(--ink);color:#FFFFFF;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 12px;font-size:12px;justify-self:start}
.scene .bignum{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.02em;color:var(--ink);line-height:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:var(--s2)}
.dots button{width:44px;height:28px;display:grid;place-items:center;border-radius:var(--pill)}
.dots button i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s var(--ease-out),background .3s}
.dots button.on i{width:22px;background:var(--ink)}
.chipf{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:0 var(--s2) 0 6px;height:40px;box-shadow:var(--shadow-pill);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.chipf .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
@keyframes drift{50%{transform:translateY(-8px)}}
.drift{animation:drift 6s ease-in-out infinite}
.drift.d2{animation-duration:7.5s;animation-delay:-2s}

/* painted shop */
svg.paint path[pathLength]{stroke-dasharray:1;stroke-dashoffset:0}
.paint-in svg.paint path[pathLength]{stroke-dashoffset:1;animation:drawl 1.4s var(--ease-out) forwards .2s}
.toran{transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(.8deg)}}

/* ---------- reveal (visible at rest; JS only offsets elements below the fold) ---------- */
.rv{transition:opacity .8s var(--ease-out),transform .8s var(--ease-out);transition-delay:calc(var(--d,0) * 70ms)}
.rv.pre{opacity:.25;transform:translateY(28px)}
.hero .ent{animation:heroin .9s var(--ease-out) both;animation-delay:calc(var(--d,0) * 90ms)}
.hero h1 .ln>span.ent{animation:lineup .9s var(--ease-out) both;animation-delay:calc(var(--d,0) * 90ms)}
@keyframes heroin{from{opacity:.001;transform:translateY(16px)}}
@keyframes lineup{from{transform:translateY(105%)}}

/* ---------- what is ---------- */
.what{display:grid;gap:var(--s5)}
@media (min-width:980px){.what{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s6)}.what .stick{position:sticky;top:calc(var(--nav) + var(--s5));align-self:start}}
.pain{display:grid;gap:var(--s1);margin-top:var(--s4)}
.pain p{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,2vw,22px);letter-spacing:-.015em;color:var(--ink-soft);display:flex;gap:var(--s2);align-items:baseline}
.pain p .ms{font-size:20px;color:var(--primary);transform:translateY(3px)}
.mess{position:relative;background:var(--inner);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s3);overflow:hidden}
.mess .top3{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3);gap:var(--s2)}
.mess .tag{font-size:13px;font-weight:500;color:var(--ink-soft);display:flex;gap:var(--s1);align-items:center}
.mess .tag b{display:inline-grid;place-items:center;height:26px;padding:0 var(--s2);border-radius:var(--pill);transition:background .3s,color .3s}
.mess .tag b.on{background:var(--ink);color:#FFFFFF}
.mstage{position:relative}
.mcard{position:absolute;left:0;top:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-xl);box-shadow:var(--shadow-soft);height:64px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2);will-change:transform,left,top,width}
.mcard .ic{width:36px;height:36px;border-radius:var(--r-xl);display:grid;place-items:center;flex:none;background:var(--muted);color:var(--ink-soft)}
.mcard .tx{position:relative;flex:1;min-width:0;height:40px}
.mcard .tx>div{position:absolute;inset:0;display:grid;align-content:center;transition:opacity .15s}
.mcard .tx b{font-weight:500;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.mcard .tx span{font-size:12px;color:var(--ink-65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.mcard .messy b{font-family:"Segoe Print","Bradley Hand",var(--font-sans)}

.is3{display:grid;gap:var(--s3);margin-top:var(--s5)}
@media (min-width:640px){.is3{grid-template-columns:repeat(3,1fr)}}
.is3 div{border-top:2px solid var(--ink);padding-top:var(--s3);display:grid;gap:var(--s1);align-content:start}

/* ---------- router (plain #name hashes only) ---------- */
let route='home', prevRoute=null, overlay=null;
function parseHash(){const h=(location.hash||'').slice(1);return h||'home'}
function go(r,ov){ if(ui.dirty&&r!==route){ askDiscard(()=>{ui.dirty=false;go(r,ov)}); return }
  if(location.hash.slice(1)!==r){ pendingOv=ov||null; location.hash=r; return } render(true); if(ov) openOv(ov) }

window.addEventListener('hashchange',()=>{ const r=parseHash(); if(ui.dirty&&r!==route){ const back=route; history.replaceState(null,'','#'+back); askDiscard(()=>{ui.dirty=false;location.hash=r}); return }
  closeOv(true); render(true); if(pendingOv){const o=pendingOv;pendingOv=null;openOv(o)} });

function countUp(){ if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
 document.querySelectorAll('#pg.enter [data-count]').forEach(el=>{ const end=+el.dataset.count, pre=el.dataset.pre||'', t0=performance.now(), d=700;
  const f=t=>{const k=Math.min(1,(t-t0)/d), v=end*(1-Math.pow(1-k,3)); el.textContent=pre+Math.round(v).toLocaleString('en-IN'); if(k<1)requestAnimationFrame(f)}; requestAnimationFrame(f) }) }
const cnt=(n,pre='')=>`<span data-count="${n}" data-pre="${pre}">${pre}${Math.round(n).toLocaleString('en-IN')}</span>`;

/* toast with optional undo */
let toastT;
function toast(msg,undo,icon='check_circle'){ clearTimeout(toastT); const z=$('#toastz');
 z.innerHTML=`<div class="toast" role="status">${ic(icon)}<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}</div>`;
 window._undo=undo||null; toastT=setTimeout(()=>{z.innerHTML='';window._undo=null},undo?6000:3200) }

  </section>

    :`<div class="inner ${d.errors.items?'':''}" style="text-align:center;padding:var(--s4) var(--s3)"><p class="t-soft">No products yet.</p><p class="cap">Add what the buyer wants. Stock updates when you create the order.</p>${d.errors.items?`<p class="err" style="justify-content:center;margin-top:var(--s1);color:var(--negative-deep);font-size:14px">${ic('error','xs')}Add at least one product.</p>`:''}</div>`}
  </section>
  <section class="card anim stack tight" style="--i:3"><h2 class="ct" id="co-pay-l">Payment</h2>
   <div class="stack tight" role="radiogroup" aria-labelledby="co-pay-l">${PAY.map(([k,l,s])=>`<button type="button" role="radio" aria-checked="${d.pay===k}" class="trow" data-act="co-pay" data-v="${k}" style="${d.pay===k?'border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)':''}">
    <span class="ic" style="background:${d.pay===k?'var(--ink)':'var(--muted)'};color:${d.pay===k?'#FFFFFF':'var(--ink-soft)'};border-radius:50%;width:24px;height:24px">${d.pay===k?ic('check','xs'):''}</span><span class="grow"><span class="t">${l}</span><span class="s">${s}</span></span></button>`).join('')}</div>

  <section class="card anim stack" style="--i:4;position:sticky;top:80px"><h2 class="ct">Summary</h2>
   <div class="kv">${lines.map(([p,q])=>`<div class="r"><span>${p.name} × ${q}</span><span>${rs(p.price*q)}</span></div>`).join('')||'<div class="r"><span>No products</span><span>₹0</span></div>'}

   <button class="btn primary full" type="submit">${d.pay==='upi'?'Create and send UPI link':'Create order'}</button>
   <a class="btn quiet full" href="#orders">Cancel</a></section>

function systemScreen(){
 const sw=(n,v,note)=>`<div><b style="background:${v}"></b><span><span class="t-ink" style="font-weight:500">${n}</span><br><code>${v.startsWith('var')?getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim().slice(0,40):v}</code>${note?`<br>${note}`:''}</span></div>`;
 return {title:'Design system',body:`
 <div class="phead anim"><div class="l"><span class="eyebrow">Design review · 27 Oct 2026</span><h1 class="h1">How this dashboard is built</h1><p class="t-body" style="max-width:62ch">One responsive app in place of two separate mock-ups. It follows Brand Kit v2 and the 25 Oct decisions. All shop data is sample data for Meera Studio.</p></div></div>
 <div class="stack loose">
 <section class="card pad-lg anim" style="--i:1"><h2 class="h2" style="margin-bottom:var(--s3)">Every screen</h2><p class="cap" style="margin-bottom:var(--s3)">Same numbers as the prototypes. Open any of them, then resize the window: phone below 760px, icon rail to 1099px, full sidebar from 1100px, Ask Stoora docks beside the page from 1280px.</p>
  <div class="idx">${SCREEN_MAP.map(([n,r,l,ov])=>`<a href="#${r}" data-go="${r}" ${ov?`data-ov="${ov}"`:''}><code>${n}</code>${l}</a>`).join('')}</div></section>
 <section class="card pad-lg anim" style="--i:2"><h2 class="h2" style="margin-bottom:var(--s3)">What changed from the prototypes</h2><ul class="notes" style="padding-left:18px;margin:0">
  <li><b>One app, three layouts.</b> The phone and laptop files were two apps. This is one codebase with breakpoints, the way the Next.js build will work.</li>
  <li><b>Morning message leads Home.</b> The PRD says sellers read a message and tap. The ideas now sit on Home with Do it and Not now, each showing what it could earn and cost. No modal first.</li>
  <li><b>Badges carry an icon and a word.</b> The prototypes used a coloured dot. Brand rule R6 asks for colour, icon and word.</li>
  <li><b>Kit values only.</b> Shadows use the warm oklch values, not rgba black. Spacing uses the φ scale (6, 10, 16, 26, 42, 68). Inputs and chips are pills. The drawer greys now come from ink and white, not new hex values.</li>
  <li><b>No exclamation marks.</b> “Good morning, Meera!” became “Good morning, Meera”, per the voice rules.</li>
  <li><b>Readable at 25 to 60.</b> Body text 15px, captions 13px, table text 14px (was 12px). Every tap target is at least 44px.</li>
  <li><b>Wordmark in the sidebar.</b> “stoora.in” in Fraunces 900 with the orange .in, beside the app icon. The prototypes used plain “Stoora” in the body font.</li>
  <li><b>Gradient budget.</b> One gradient button per screen at most, plus eyebrow labels and the app icon. Home has no gradient button at all.</li>
  <li><b>Honest edges.</b> Settings pages other than General show a “not designed yet” state, not fake forms. Ask Stoora answers three sample questions and says so for the rest.</li></ul></section>
 <section class="card pad-lg anim" style="--i:3"><h2 class="h2" style="margin-bottom:var(--s3)">Colour</h2>
  <p class="label" style="margin-bottom:var(--s2)">Ground and ink</p><div class="sw">${[['Page','var(--surface)'],['Card','var(--card)'],['Inside a card','var(--inner)'],['Sunken','var(--muted)'],['Border','var(--line)'],['Heading ink','var(--ink)'],['Sub-heading ink','var(--ink-soft)'],['Body ink','var(--ink-65)'],['Caption ink','var(--ink-45)','Captions only, 3.6:1']].map(a=>sw(...a)).join('')}</div>
  <p class="label" style="margin:var(--s4) 0 var(--s2)">Signal — text uses the deep shade on the tint</p><div class="sw">${[['Primary','var(--primary)'],['Primary deep','var(--primary-deep)'],['Primary tint','var(--primary-tint)'],['Waiting deep','var(--marigold-deep)'],['Waiting tint','var(--marigold-tint)'],['Paid deep','var(--positive-deep)'],['Paid tint','var(--positive-tint)'],['Failed deep','var(--negative-deep)'],['Failed tint','var(--negative-tint)']].map(a=>sw(...a)).join('')}</div>
  <p class="label" style="margin:var(--s4) 0 var(--s2)">Gradients — about 5% of a screen</p><div class="sw">${sw('Action','var(--gradient-action)','Main button, eyebrows')}${sw('Warm','var(--gradient-warm)','App icon, shop avatar')}${sw('Soft','var(--gradient-soft)','Drawing panels')}</div></section>
 <section class="card pad-lg anim" style="--i:4"><h2 class="h2" style="margin-bottom:var(--s3)">Type</h2><dl class="spec">
  <dt>Page title</dt><dd><span class="h1">Good morning, Meera</span><div class="cap">Bricolage Grotesque 800 · 28px phone, 32px wider · −0.025em</div></dd>
  <dt>Big number</dt><dd><span class="big" style="font-size:28px">₹8,195</span><div class="cap">Bricolage 800 · 28px · tabular figures</div></dd>
  <dt>Card title</dt><dd><span class="ct">To do today</span><div class="cap">Lexend 600 · 17px</div></dd>
  <dt>Body</dt><dd><span class="t-body">Rahul has not paid ₹1,499 for 2 days.</span><div class="cap">Lexend 400 · 15px · warm brown ink</div></dd>
  <dt>Eyebrow</dt><dd><span class="eyebrow">Morning message</span><div class="cap">Lexend 700 · 11px · +0.16em · action gradient</div></dd>
  <dt>Wordmark</dt><dd><span class="wordmark">stoora<i>.in</i></span><div class="cap">Fraunces 900 · logo only</div></dd></dl></section>
 <section class="card pad-lg anim" style="--i:5"><h2 class="h2" style="margin-bottom:var(--s3)">Components</h2><div class="stack">
  <div class="btns"><button class="btn primary">Main action</button><button class="btn ink">Second action</button><button class="btn line">Other action</button><button class="btn quiet">Cancel</button><button class="btn danger">${ic('delete')}Delete</button></div>
  <div class="btns">${bdg('ok','check_circle','Paid')}${bdg('warn','schedule','Unpaid')}${bdg('warn','local_shipping','To ship')}${bdg('neutral','done_all','Shipped')}${bdg('bad','block','Sold out')}${bdg('offer','event_upcoming','Upcoming')}${src('WhatsApp')}${src('Instagram')}</div>
  <div class="row" style="flex-wrap:wrap"><div class="chips"><button class="chip on">All<span class="n">4</span></button><button class="chip">To ship<span class="n">1</span></button></div><div class="seg inline"><button class="on">Orders</button><button>Bookings</button></div><button class="switch" role="switch" aria-checked="true" aria-label="Example switch" data-act="demo-sw"></button></div>
  <div class="grid2"><div class="field"><label for="ds-a">Label above every field</label><input class="input" id="ds-a" placeholder="Example, never the only label"></div><div class="field"><label for="ds-b">Money field</label><div class="affix"><span>₹</span><input id="ds-b" inputmode="numeric" value="1,499"></div></div></div>
  <div class="field"><label for="ds-c">Error state</label><input class="input bad" id="ds-c" aria-invalid="true"><span class="err">${ic('error','xs')}Say what to do, not what went wrong.</span></div></div></section>
 <section class="card pad-lg anim" style="--i:6"><h2 class="h2" style="margin-bottom:var(--s3)">Rules that do not change</h2><dl class="spec">
  <dt>Shape</dt><dd class="t-soft">Anything you tap is a pill (50px radius). Anything that holds content is 12px or 16px.</dd>
  <dt>Spacing</dt><dd class="t-soft">6, 10, 16, 26, 42, 68. No 8, 12, 24 or 32.</dd>
  <dt>Shadow</dt><dd class="t-soft">Warm brown oklch only. Cards use the soft shadow; sheets and toasts use the warm one.</dd>
  <dt>Icons</dt><dd class="t-soft">Material Symbols Rounded, outline, weight 400. 20px in lists, 24px default. No emoji.</dd>
  <dt>Motion</dt><dd class="t-soft">Cards rise in, numbers count up, badges pop, drawings draw. All of it turns off with reduced motion.</dd>
  <dt>Drawings</dt><dd class="t-soft">Painted-sign style, only on empty screens and setup cards. Mihitha redraws the final set in Figma as SVG.</dd></dl></section>
 </div>`}}

let opener=null;
function sheet(id,title,body,foot='',o={}){ return `<div class="scrim" data-act="close"></div>

function setLayer(html,focusSel){ opener=opener||document.activeElement; const L=$('#layer'); L.innerHTML=html; document.body.style.overflow='hidden';
 const f=L.querySelector(focusSel||'input,textarea,[data-focus]')||L.querySelector('button'); f&&setTimeout(()=>f.focus({preventScroll:true}),40) }
function closeOv(silent){ const L=$('#layer'); if(!L.innerHTML) return; L.innerHTML=''; overlay=null; document.body.style.overflow=''; if(!silent&&opener&&opener.isConnected) opener.focus({preventScroll:true}); opener=null }
function openOv(name,arg){ overlay=name;
 ({menu:openMenu,search:openSearch,alerts:openAlerts,ask:()=>openAsk(arg),ship:()=>openShip(arg||route.split('-')[1]),picker:openPicker,offer:openOffer,
   morning:()=>{const m=$('#mm-h');m&&m.closest('section').scrollIntoView({behavior:'smooth',block:'start'})}}[name]||(()=>{}))() }

/* ---------- Ask Stoora (F1) ---------- */
ui.askOpen=false;
function answer(q){ const t=q.toLowerCase();
 if(/week|how did|how am i|sales/.test(t)){ const a=AN['7']; return `<p class="t-ink">You made <b class="num">${rs(a.v.reduce((x,y)=>x+y,0))}</b> in the last 7 days, 18% more than the week before.</p><p class="t-soft">Saturday was your best day. Almost half the orders came from WhatsApp.</p>
  <div style="background:var(--surface);border-radius:var(--r-xl);padding:var(--s2)">${barsHTML(a.x,a.v,'Sales by day, last 7 days')}</div>
  <div class="inner stack tight"><span class="label" style="font-size:11px">One idea</span><p class="t-soft">The indigo kurta set sold fastest and has 3 left. Make 10 more before Friday, when your new prints go up.</p><div class="btns"><button class="btn ink sm" data-act="ask-idea">Remind me Thursday</button></div></div>` }
 if(/ship/.test(t)) return `<p class="t-ink">Ship <b>#1012</b> first. Priya paid ${rs(3798)} by UPI this morning and lives in Pune, so a courier can pick up today.</p><p class="t-soft">#1011 is not paid yet. Stoora can remind Rahul on WhatsApp.</p><div class="btns"><a class="btn ink sm" href="#order-1012">Open #1012</a><button class="btn line sm" data-act="remind" data-who="Rahul Verma">Remind Rahul</button></div>`;
 if(/post|write|caption|instagram/.test(t)) return `<p class="t-ink">Here is a post for the indigo kurta set. It uses your real stock count.</p><div class="inner"><p class="t-soft" id="cap-txt">Only 3 left. Our indigo kurta set is hand block printed in Jaipur with natural dye, and it softens with every wash. Sizes M and L. ₹2,899, free shipping. DM “INDIGO” to book yours.</p></div><div class="btns"><button class="btn ink sm" data-act="copy" data-from="#cap-txt">${ic('content_copy')}Copy post</button></div>`;
 return `<p class="t-soft">In this design preview Stoora answers three sample questions. Connected to your shop, it answers anything about your orders, money and buyers from your real numbers.</p><div class="sugg" style="flex-wrap:wrap">${['How did I do this week?','Which orders should I ship first?','Write a post for my indigo kurta set'].map(x=>`<button data-act="ask" data-q="${x}">${x}</button>`).join('')}</div>` }
function askPanelHTML(sheetMode){ const log=S.askLog;
 return `<div class="askpanel">
  <div class="sheet-h" style="${sheetMode?'':'padding:var(--s3)'};border-bottom:1px solid var(--line-soft)"><span class="smark" aria-hidden="true">S</span><div class="grow"><h2 class="ct" id="ask-t">Ask Stoora</h2><p class="cap">Plain answers from your shop’s numbers</p></div>${log.length?`<button class="btn quiet sm" data-act="ask-clear">New chat</button>`:''}${sheetBtnClose}</div>
  <div class="sheet-b" id="ask-log" style="padding-top:var(--s3);display:grid;gap:var(--s3);align-content:start" aria-live="polite">
   ${log.length?log.map(m=>`<div class="ans"><div class="qbubble">${esc(m.q)}</div><div class="abox"><div class="who"><span class="smark xs" aria-hidden="true">S</span>Stoora</div>${m.a||'<span class="typing" aria-label="Stoora is writing"><i></i><i></i><i></i></span>'}</div></div>`).join('')
   :`<div class="stack tight">${ART('chat',80)}<p class="t-soft" style="text-align:center">Ask about sales, orders, buyers or money. You get two lines, a chart and one idea.</p></div><div class="stack tight">${['How did I do this week?','Which orders should I ship first?','Write a post for my indigo kurta set'].map(q=>`<button class="trow" data-act="ask" data-q="${q}"><span class="grow t-soft">${q}</span>${ic('arrow_forward','sm t-cap')}</button>`).join('')}</div>`}
  </div>
  <form class="askbox" data-form="ask" style="margin:var(--s2) var(--s3) calc(var(--s3) + ${sheetMode?'env(safe-area-inset-bottom,0px)':'0px'});flex:none"><label class="sr" for="ask-q">Ask Stoora</label><textarea id="ask-q" rows="1" placeholder="Ask anything about your shop"></textarea><div class="tools"><span class="cap grow">Nothing changes until you tap a button</span><button class="go" type="submit" aria-label="Ask">${ic('arrow_upward','sm')}</button></div></form></div>` }
function renderAsk(){ if(document.body.classList.contains('docked')&&innerWidth>=1280){ renderDock(); return }
 const sh=$('#ask-sheet'); if(sh){ sh.innerHTML=askPanelHTML(true); const l=$('#ask-log'); l&&(l.scrollTop=l.scrollHeight) } }
function renderDock(){ const d=$('#askdock'); if(!document.body.classList.contains('docked')){ d.innerHTML=''; return } d.innerHTML=askPanelHTML(false); const l=$('#ask-log'); l&&(l.scrollTop=l.scrollHeight) }
function openAsk(q){
 if(innerWidth>=1280){ document.body.classList.add('docked'); ui.askOpen=true; renderDock(); setTimeout(()=>$('#ask-q')?.focus(),40) }
 else setLayer(`<div class="scrim" data-act="close"></div><div class="sheet full" role="dialog" aria-modal="true" aria-labelledby="ask-t" id="ask-sheet" style="${innerWidth>=760?'':'top:0'}">${askPanelHTML(true)}</div>`,'#ask-q');
 if(q) ask(q) }
function ask(q){ q=q.trim(); if(!q) return; const m={q,a:null}; S.askLog.push(m); renderAsk(); setTimeout(()=>{ m.a=answer(q); renderAsk() },750) }

/* ---------- save bar ---------- */
function syncSave(){ const z=$('#savez'); const show=ui.dirty&&/^(add-product|add-service|product-|shop-settings-general)/.test(route);
 z.innerHTML=show?`<div class="savebar" role="region" aria-label="Unsaved changes"><span class="msg">${ic('edit_note','sm')}<span>Unsaved changes</span></span><button class="btn line sm" data-act="discard">Discard</button><button class="btn save sm" data-act="save">Save</button></div>`:'' }
function markDirty(){ if(!ui.dirty){ ui.dirty=true; syncSave() } }

/* ---------- saves ---------- */
const toNum=s=>+(String(s).replace(/[^\d.]/g,''))||0;
function save(){
 const f=ui.form;
 if(route==='shop-settings-general'){ f.errors={}; if(!f.name.trim()) f.errors.name=1; if(Object.keys(f.errors).length){render(false);syncSave();toast('Your shop needs a name to save',null,'error');return}
  Object.assign(S.shop,{name:f.name.trim(),handle:f.handle.trim()||S.shop.handle,email:f.email,phone:f.phone}); ui.dirty=false; ui.form={}; syncSave(); render(false); toast('Saved'); return }
 if(route==='add-service'){ f.errors={}; if(!f.name.trim())f.errors.name=1; if(!toNum(f.price))f.errors.price=1; if(Object.keys(f.errors).length){render(false);syncSave();toast('Add a name and price to save',null,'error');return}
  S.services.push({id:'v'+(S.services.length+1),name:f.name.trim(),type:f.type,price:toNum(f.price),mins:+f.mins,next:f.type==='Digital'?'Instant download':`${f.days.join(', ')} · ${f.time}`,icon:f.type==='Class'?'self_improvement':f.type==='Digital'?'menu_book':'person'});
  ui.dirty=false; ui.form={}; syncSave(); location.hash='services'; toast('Service added'); return }
 f.errors={}; if(!f.name.trim())f.errors.name=1; if(!toNum(f.price))f.errors.price=1;
 if(Object.keys(f.errors).length){ render(false); syncSave(); toast('Add a name and price to save',null,'error'); return }
 const data={name:f.name.trim(),price:toNum(f.price),stock:toNum(f.stock),status:f.status};
 if(f.pid==='new') S.products.unshift({id:'p'+(Date.now()%100000),icon:'apparel',sold:0,...data}); else Object.assign(S.products.find(p=>p.id===f.pid),data);
 ui.dirty=false; ui.form={}; syncSave(); location.hash='products'; toast(f.pid==='new'?'Product added':'Product saved') }

function createOrder(){ const d=ui.draft; d.errors={}; if(!d.who.trim()) d.errors.who=1; if(!d.items.length) d.errors.items=1;
 if(Object.keys(d.errors).length){ render(false); $(d.errors.who?'#co-who':'[data-act="picker"]')?.focus(); return }
 const id=S.nextOrder++; const total=d.items.reduce((a,[p,q])=>a+prod(p).price*q,0);
 S.orders.unshift({id,who:d.who.trim(),phone:d.phone,items:d.items.map(x=>[...x]),total,paid:d.pay==='paid',pay:d.pay==='cod'?'cod':'upi',shipped:false,src:d.src||'WhatsApp',when:'Just now',city:'Jaipur'});
 d.items.forEach(([p,q])=>{const x=S.products.find(y=>y.id===p); if(x) x.stock=Math.max(0,x.stock-q)});
 const msg=d.pay==='upi'?`Order #${id} created. UPI link sent to ${d.who.trim().split(' ')[0]}`:`Order #${id} created`;
 ui.draft={who:'',phone:'',items:[],pay:'paid',errors:{}}; ui.dirty=false; location.hash='order-'+id; toast(msg) }

/* ================= events ================= */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'); const a=e.target.closest('[data-act]');
 if(a&&(!g||g.contains(a))){ act(a.dataset.act,a,e); return }
 if(g){ e.preventDefault(); const ov=g.dataset.ov; closeOv(true); go(g.dataset.go,ov); return }
 const link=e.target.closest('a[href^="#"]'); if(link){ if(link.dataset.filter) ui.orderFilter=link.dataset.filter; if(link.getAttribute('href')==='#orders'&&!link.dataset.filter&&link.closest('.side,.bbar,.drawer')) ui.orderFilter='All';
  if($('#layer').innerHTML){ closeOv(true) } if(link.getAttribute('href').slice(1)===route){ e.preventDefault(); render(false) } }
});
function act(k,el,e){ const d=el.dataset; const id=d.id;
 switch(k){
 case 'menu': return openMenu();
 case 'search': closeOv(true); return openSearch();
 case 'alerts': return openAlerts();
 case 'ask': closeOv(true); return d.q&&(document.body.classList.contains('docked')||$('#ask-sheet'))?ask(d.q):openAsk(d.q);
 case 'close': if(el.closest('.askdock')){ document.body.classList.remove('docked'); ui.askOpen=false; return renderDock() } return closeOv();
 case 'ask-clear': S.askLog=[]; return renderAsk();
 case 'ask-idea': return toast('Stoora will remind you on Thursday morning');
 case 'undo': { const u=window._undo; window._undo=null; $('#toastz').innerHTML=''; u&&u(); return }
 case 'idea-yes': case 'idea-no': { const i=S.ideas.find(x=>x.id===id); const card=$('#idea-'+id); card&&card.classList.add('out');
  setTimeout(()=>{ S.ideasGone.push(id); render(false); toast(k==='idea-yes'?i.done:'Hidden until tomorrow',()=>{S.ideasGone=S.ideasGone.filter(x=>x!==id);render(false)}) },matchMedia('(prefers-reduced-motion:reduce)').matches?0:260); return }
 case 'setup-hide': S.setupHidden[d.k]=1; render(false); return toast('Step hidden',()=>{delete S.setupHidden[d.k];render(false)});
 case 'setup-unhide': S.setupHidden={}; return render(false);
 case 'setup-do': { const s=SETUP.find(x=>x.k===d.k); if(s.go){ return go(s.go) } if(d.k==='link'){ copy('https://stoora.in/'+S.shop.handle) } S.setupDone[d.k]=true; render(false); if(d.k!=='link') toast({whatsapp:'WhatsApp connected',instagram:'Instagram connected',payments:'UPI payments are on'}[d.k]||'Done'); return }
 case 'leave-newshop': S.newShop=false; S.leftSetup=true; return go('home');
 case 'ofilter': ui.orderFilter=d.f; return render(false);
 case 'mark-paid': { const o=ord(id); o.paid=true; render(false); return toast(`Order #${o.id} marked as paid`,()=>{o.paid=false;render(false)}) }
 case 'remind': return toast(`UPI reminder sent to ${d.who.split(' ')[0]} on WhatsApp`,null,'send');
 case 'copy': return copy(d.from?$(d.from).textContent:d.text);
 case 'ship': return openShip(id);
 case 'ship-confirm': { const o=ord(id); const c=$('#shp-c').value, t=$('#shp-t').value.trim(); o.shipped=true; o.courier=c.startsWith('I will')?null:c; o.track=t; closeOv(true); render(false); return toast(`Order #${o.id} marked as shipped`,()=>{o.shipped=false;render(false)}) }
 case 'toggle': case 'demo-sw': return el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');
 case 'picker': return openPicker();
 case 'pick': { const p=S.products.find(x=>x.id===id); ui.pick[id]=Math.max(0,Math.min(p.stock,(ui.pick[id]||0)+ +d.d)); if(!ui.pick[id]) delete ui.pick[id];
  $('#pkr-l').innerHTML=pickerBody($('#pkr-q')?.value||''); $('#pkr-f').innerHTML=pickerFoot(); return }
 case 'pick-done': ui.draft.items=Object.entries(ui.pick); ui.draft.errors.items=0; ui.dirty=true; closeOv(true); return render(false);
 case 'co-qty': { const it=ui.draft.items.find(x=>x[0]===id); it[1]+= +d.d; if(it[1]<=0) ui.draft.items=ui.draft.items.filter(x=>x!==it); return render(false) }
 case 'co-pay': ui.draft.pay=d.v; return render(false);
 case 'co-src': ui.draft.src=d.v; return render(false);
 case 'book-paid': { const b=S.bookings.find(x=>x.id===id); b.paid=true; render(false); return toast(`Booking ${b.id} marked as paid`,()=>{b.paid=false;render(false)}) }
 case 'book-done': { const b=S.bookings.find(x=>x.id===id); b.status='Done'; render(false); return toast('Marked as done',()=>{b.status='Upcoming';render(false)}) }
 case 'pf-sw': ui.form[d.k]=!ui.form[d.k]; el.setAttribute('aria-checked',ui.form[d.k]); return markDirty();
 case 'pf-ch': ui.form.ch[d.k]=!ui.form.ch[d.k]; el.setAttribute('aria-checked',ui.form.ch[d.k]); return markDirty();
 case 'pf-more': ui.form.more=!ui.form.more; return render(false);
 case 'pf-size': { const s=ui.form.sizes; ui.form.sizes=s.includes(d.v)?s.filter(x=>x!==d.v):[...s,d.v]; markDirty(); return render(false) }
 case 'pf-delete': { const i=S.products.findIndex(p=>p.id===id); const [p]=S.products.splice(i,1); ui.dirty=false; ui.form={}; syncSave(); location.hash='products'; return toast(`Deleted ${p.name}`,()=>{S.products.splice(i,0,p);render(false)}) }
 case 'sv-type': ui.form.type=d.v; markDirty(); return render(false);
 case 'sv-day': { const s=ui.form.days; ui.form.days=s.includes(d.v)?s.filter(x=>x!==d.v):[...s,d.v]; markDirty(); return render(false) }
 case 'save': return save();
 case 'discard': ui.dirty=false; ui.form={}; syncSave(); return render(false);
 case 'discard-leave': { ui.dirty=false; ui.form={}; ui.draft={who:'',phone:'',items:[],pay:'paid',errors:{}}; syncSave(); const cb=ui._discard; closeOv(true); cb&&cb(); return }
 case 'chat-tab': ui.chatTab=d.v; if(route!=='chats'){ location.hash='chats'; return } return render(false);
 case 'edit-draft': ui.editing[id]=true; render(false); return setTimeout(()=>$('#dr-'+id)?.focus(),30);
 case 'drop-draft': { const c=S.chats.find(x=>x.id===id); const was=c.draft; c.draft=null; render(false); return toast('Reply dismissed',()=>{c.draft=was;render(false)}) }
 case 'send-draft': { const c=S.chats.find(x=>x.id===id); sendMsg(c,c.draft); c.draft=null; ui.editing[id]=false; render(false); return toast(`Sent to ${c.who.split(' ')[0]} on ${c.src}`,null,'send') }
 case 'send-upi': { const c=S.chats.find(x=>x.id===id); sendMsg(c,`Here is your UPI link to pay ${S.shop.name}: stoora.in/pay/${c.id}x`); render(false); return toast('UPI link sent',null,'send') }
 case 'chat-order': { const c=S.chats.find(x=>x.id===id); ui.draft={who:c.who,phone:'',items:id==='c1'?[['p3',1]]:[],pay:'upi',src:c.src,errors:{}}; ui.dirty=true; return go('create-order') }
 case 'chat-book': { const c=S.chats.find(x=>x.id===id); sendMsg(c,'Pick a time that suits you: stoora.in/meera/book'); render(false); return toast('Booking link sent',null,'send') }
 case 'mrange': ui.moneyRange=d.v; return render(true);
 case 'arange': ui.anRange=d.v; return render(true);
 case 'shop-sw': S.shop[d.k]=!S.shop[d.k]; render(false); return toast(S.shop[d.k]?'Turned on':'Turned off');
 case 'theme': ui.theme=d.v; return render(false);
 case 'new-offer': return openOffer();
 case 'offer-type': { ui.offer.type=d.v; el.parentNode.querySelectorAll('button').forEach(b=>{const on=b===el;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)}); $('#of-al').textContent=d.v==='pct'?'How much off, in %':'How much off, in ₹'; return }
 case 'offer-save': { const code=$('#of-code').value.trim().toUpperCase(), amt=toNum($('#of-amt').value); if(!code||!amt){ $('#of-err').hidden=false; return }
  const end=new Date($('#of-end').value); S.offers.unshift({code,what:(ui.offer.type==='pct'?amt+'% off ':rs(amt)+' off ')+($('#of-on').value==='Everything'?'everything':$('#of-on').value.toLowerCase()),used:0,ends:isNaN(end)?'No end date':'Ends '+end.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),on:true}); closeOv(true); render(false); return toast(`Offer ${code} is live`) }
 case 'offer-sw': { const o=S.offers[+d.i]; o.on=!o.on; render(false); return toast(`${o.code} turned ${o.on?'on':'off'}`) }
 }}
function sendMsg(c,t){ c.msgs.push(['me',t,'Now']); c.unread=false; c.last=t }
function copy(t){ const ok=()=>toast('Copied',null,'content_copy'); try{ navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok)) }catch(_){ fallbackCopy(t,ok) } }
function fallbackCopy(t,ok){ const x=document.createElement('textarea'); x.value=t; x.style.position='fixed'; x.style.opacity='0'; document.body.appendChild(x); x.select(); let r=false; try{ r=document.execCommand('copy') }catch(_){} x.remove(); r?ok():toast('Select the text and copy it',null,'info') }

document.addEventListener('input',e=>{ const t=e.target, d=t.dataset;
 if(d.input==='orderQ'){ ui.orderQ=t.value; const q=t.value.trim().toLowerCase(); $('#olist').innerHTML=ordersList(S.orders.filter(OF[ui.orderFilter]).filter(o=>!q||(o.who+' #'+o.id+' '+o.src).toLowerCase().includes(q))); return }
 if(d.input==='prodQ'){ ui.prodQ=t.value; const q=t.value.trim().toLowerCase(); $('#plist').innerHTML=productsList(S.products.filter(p=>!q||p.name.toLowerCase().includes(q))); return }
 if(d.input==='setQ'){ ui.setQ=t.value; const q=t.value.trim().toLowerCase(); const rows=SET.filter(([l])=>!q||l.toLowerCase().includes(q)); $('#setlist').innerHTML=`<nav class="setlist" aria-label="Settings">${rows.map(([l,i])=>`<a class="set-row" href="#shop-settings-${slug(l)}">${ic(i)}<span>${l}</span>${ic('chevron_right','sm')}</a>`).join('')||`<p class="cap" style="padding:var(--s3)">No setting called “${esc(t.value)}”. Try “payments” or “shipping”.</p>`}</nav>`; return }
 if(d.input==='search'){ $('#sres').innerHTML=searchResults(t.value); return }
 if(d.input==='pick'){ $('#pkr-l').innerHTML=pickerBody(t.value); return }
 if(d.draft){ ui.draft[d.draft]=t.value; ui.dirty=!!(ui.draft.who||ui.draft.items.length); if(ui.draft.errors[d.draft]&&t.value.trim()){ ui.draft.errors[d.draft]=0; t.classList.remove('bad'); t.removeAttribute('aria-invalid'); t.parentNode.querySelector('.err')?.remove() } return }
 if(d.pf){ ui.form[d.pf]=t.value; markDirty(); if(ui.form.errors&&ui.form.errors[d.pf]&&t.value.trim()){ ui.form.errors[d.pf]=0; (t.closest('.affix')||t).classList.remove('bad'); t.closest('.field').querySelector('.err')?.remove() } return }
 if(d.draftmsg){ const c=S.chats.find(x=>x.id===d.draftmsg); c.draft=t.value; return }
 if(t.closest('.askbox')){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,160)+'px' }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.pf&&t.tagName==='SELECT'){ ui.form[t.dataset.pf]=t.value; markDirty(); if(t.dataset.pf==='status') render(false), syncSave() } if(t.id==='pf-photos') addPhotos(t.files) });
document.addEventListener('submit',e=>{ const f=e.target; if(!f.dataset.form) return; e.preventDefault();
 const k=f.dataset.form;
 if(k==='ask'||k==='home-ask'){ const ta=f.querySelector('textarea'); const q=ta.value; ta.value=''; if(!q.trim()){ ta.focus(); return } if(k==='home-ask') openAsk(q); else ask(q); return }
 if(k==='chat'){ const c=S.chats.find(x=>x.id===f.dataset.id); const v=f.querySelector('input').value.trim(); if(!v) return; sendMsg(c,v); render(false); $('#msg-'+c.id)?.focus(); return }
 if(k==='create') return createOrder();
 if(k==='product'||k==='service'||k==='general') return save() });
document.addEventListener('keydown',e=>{
