# Supabase CLI settings for local development (`supabase start`). The hosted project is configured in the dashboard instead:
# see supabase/README.md. Secrets are read from the environment, never written here.
project_id = "stoora"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

# Sign in with Google: create an OAuth client in Google Cloud, then export GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# One-time codes by WhatsApp / SMS (Twilio). Export the three TWILIO_* values.
[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
