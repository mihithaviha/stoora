<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Shop · Stoora</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Lexend:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/css/storefront.css">
    <link rel="stylesheet" href="/css/commerce.css">
    <style>
      :root {
        --ink: #171c3c;
        --ink-soft: #303652;
        --muted: #f2eadd;
        --inner: #fffaef;
        --line: #e0d6ca;
        --primary: #ea5b1e;
        --negative: #de3c37;
        --gold: #b07a00;
        --gradient: linear-gradient(90deg, #ffb347 0%, #ff6b2c 55%, #c13fa8 100%);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: Lexend, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      h2 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 22px;
        margin: 28px 0 12px;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .hero {
        color: #fff;
        text-align: center;
        padding: 44px 16px 36px;
      }
      .hero h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.1;
        margin: 0 0 6px;
      }
      .hero p {
        margin: 0;
        opacity: 0.92;
      }
      .contact {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
      .item {
        background: var(--inner);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .photo {
        aspect-ratio: 4/3;
        background: var(--muted);
        display: grid;
        place-items: center;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 44px;
        color: var(--ink-soft);
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .body {
        padding: 12px 14px 14px;
        display: grid;
        gap: 6px;
        flex: 1;
        align-content: start;
      }
      .body b {
        font-weight: 600;
      }
      .price {
        font-weight: 700;
      }
      .sub {
        font-size: 13px;
        color: #725f54;
      }
      .low {
        color: #951f27;
      }
      .stars {
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 1px;
      }

      .step {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        height: 40px;
      }
      .step button {
        width: 40px;
        height: 38px;
        border: 0;
        background: none;
        font-size: 20px;
        border-radius: 999px;
      }
      .step span {
        min-width: 26px;
        text-align: center;
        font-weight: 600;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        padding: 0 22px;
        border-radius: 999px;
        border: 0;
        font-weight: 600;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
      }
      .btn.main {
        background: var(--gradient);
      }
      .btn.line {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .cartbar {
        position: sticky;
        bottom: 0;
        background: #fff;
        border-top: 1px solid var(--line);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        margin-top: 28px;
        z-index: 5;
      }
      .cartbar .in {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
      }

      .sheet {
        position: fixed;
        inset: 0;
        background: rgba(23, 28, 60, 0.45);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 20;
      }
      .sheet.on {
        display: flex;
      }
      .panel {
        background: #fff;
        width: 100%;
        max-width: 520px;
        max-height: 92vh;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      }
      @media (min-width: 640px) {
        .sheet {
          align-items: center;
        }
        .panel {
          border-radius: 22px;
        }
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }
      .field label {
        font-weight: 600;
        font-size: 14px;
      }
      .input {
        width: 100%;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 14px;
        background: #fff;
        font-size: 16px;
      }
      textarea.input {
        height: auto;
        min-height: 80px;
        padding: 12px 14px;
      }
      .err {
        color: var(--negative);
        font-size: 13px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }
      .note {
        background: var(--inner);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
        margin: 12px 0;
      }
      .note.ok {
        background: #dcefdf;
        border-color: #b6dcc0;
        color: #065f37;
      }
      .review {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }

      details {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      details p {
        white-space: pre-wrap;
        margin: 8px 0 0;
        color: var(--ink-soft);
      }
      footer {
        padding: 28px 16px 40px;
        text-align: center;
        color: #725f54;
        font-size: 13px;
      }
      footer a {
        color: inherit;
      }
      .empty {
        text-align: center;
        padding: 40px 16px;
        color: #725f54;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="empty">Loading shop…</div></div>

    <script src="/js/storefront/shared.js"></script>
    <script src="/js/storefront/templates.js"></script>
    <script src="/js/storefront/commerce.js"></script>
    <script>
      /*
       * The public shop page. It draws the shop (the seller's published template, or the plain list) and hands every
       * buying action to StoreCommerce (public/js/storefront/commerce.js), so all templates sell the same way.
       */

      const LOOKS = [
        'linear-gradient(135deg,#f4a24a,#dc4a3a 45%,#8b3a9e 80%,#262a7a)',
        'linear-gradient(135deg,#262a7a,#5f3ba8)',
        'linear-gradient(135deg,#FFB407,#EA5B1E)',
        'linear-gradient(135deg,#0FA05C,#065F37)',
        'linear-gradient(135deg,#D13A5B,#8B3A9E)',
        'linear-gradient(135deg,#171C3C,#303652 55%,#EA5B1E)',
        'linear-gradient(135deg,#F4A24A,#8B3A9E)',
      ];

      let handle = location.pathname.split('/').filter(Boolean)[1] || ''; // /s/<handle>; empty on a seller's own domain
      let shop = null;

      /* ---------- small helpers ---------- */

      const $ = (id) => document.getElementById(id);
      const rupees = (n) => '₹' + Number(n).toLocaleString('en-IN');
      const stars = (rating) => '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      const isService = (item) => Boolean(item.type);
      const sellsProducts = () =>
        (shop.storefront ? shop.storefront.data.products : shop.products).length > 0;
      const optionsOf = (item) =>
        [...new Set(String(item.sizes || '').split(',').map((part) => part.trim()).filter(Boolean))];

      /* ---------- the plain shop page (a shop without a published storefront) ---------- */

      function productCard(item) {
        const service = isService(item);
        const soldOut = !service && item.stock != null && item.stock <= 0;
        const qty = StoreCommerce.qtyById()[item.id] || 0;
        const rating = shop.ratings[item.id];
        const photo = item.img
          ? `<img src="${escapeHtml(item.img)}" alt="" loading="lazy">`
          : escapeHtml((item.name || '?')[0].toUpperCase());
        const detail = service
          ? `${escapeHtml(item.type)}${item.next ? ' · ' + escapeHtml(item.next) : ''}`
          : escapeHtml((item.desc || '').slice(0, 90));
        const button = optionsOf(item).length
          ? `<button class="btn line" data-view="${escapeHtml(item.id)}">Choose size</button>`
          : qty
            ? `<div class="step" role="group" aria-label="Quantity"><button data-d="-1" data-id="${escapeHtml(item.id)}" aria-label="Less">−</button><span>${qty}</span><button data-d="1" data-id="${escapeHtml(item.id)}" aria-label="More">+</button></div>`
            : `<button class="btn line" data-d="1" data-id="${escapeHtml(item.id)}">Add</button>`;

        return `<div class="item"><div class="photo"${service ? '' : ` data-view="${escapeHtml(item.id)}" style="cursor:pointer"`}>${photo}</div><div class="body">
    <b>${service ? escapeHtml(item.name) : `<a href="#product-${escapeHtml(item.id)}" data-view="${escapeHtml(item.id)}" style="color:inherit;text-decoration:none">${escapeHtml(item.name)}</a>`}</b>
    ${detail ? `<span class="sub">${detail}</span>` : ''}
    ${rating ? `<span class="stars" title="${rating.average.toFixed(1)} out of 5">${stars(rating.average)} <span class="sub">(${rating.count})</span></span>` : ''}
    <span class="price">${rupees(item.price)}</span>
    ${soldOut ? '<span class="sub low">Sold out</span>' : !service && item.stock != null && item.stock <= 3 ? `<span class="sub low">Only ${item.stock} left</span>` : ''}
    ${soldOut ? '' : button}</div></div>`;
      }

      function contactButtons() {
        const { whatsapp, instagram } = shop.contact;
        return [
          whatsapp
            ? `<a class="pill" href="https://wa.me/91${escapeHtml(whatsapp)}" target="_blank" rel="noopener">Chat on WhatsApp</a>`
            : '',
          instagram
            ? `<a class="pill" href="https://instagram.com/${escapeHtml(instagram)}" target="_blank" rel="noopener">Instagram</a>`
            : '',
          '<button class="pill" id="track">Where is my order?</button>',
        ].join('');
      }

      function aboutSection() {
        const policies = [
          ['Refund policy', shop.policies.refund],
          ['Shipping policy', shop.policies.shipping],
          ['Privacy policy', shop.policies.privacy],
          ['Terms of service', shop.policies.terms],
        ].filter(([, text]) => text);
        const facts = [
          shop.address,
          shop.gstin ? 'GSTIN ' + shop.gstin : '',
          shop.pricesIncludeGst ? 'Prices include GST.' : '',
        ].filter(Boolean);
        const reviews = shop.recentReviews.filter((r) => r.comment);
        return `${reviews.length ? `<h2>What buyers say</h2>${reviews.map((r) => `<div class="review"><span class="stars">${stars(r.rating)}</span> <b>${escapeHtml(r.who)}</b><br>${escapeHtml(r.comment)}</div>`).join('')}` : ''}
    ${facts.length || policies.length ? `<h2>About this shop</h2>${facts.map((f) => `<p class="sub" style="margin:0 0 4px">${escapeHtml(f)}</p>`).join('')}${policies.map(([title, text]) => `<details><summary>${title}</summary><p>${escapeHtml(text)}</p></details>`).join('')}` : ''}`;
      }

      /** The bag button that stays on the page, with the number of items in it. */
      function bagButton() {
        const n = StoreCommerce.count();
        return `<button class="cm-bag" type="button" data-cart aria-label="Open your bag, ${n} item${n === 1 ? '' : 's'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Bag<span class="n">${n}</span></button>`;
      }

      /** The saved-items button, beside the bag button. */
      function wishButton() {
        const n = StoreCommerce.wishCount();
        return `<button class="cm-wish" type="button" data-wishlist aria-label="Open your saved items, ${n}"><span aria-hidden="true">${n ? '♥' : '♡'}</span>Saved<span class="n">${n}</span></button>`;
      }

      /** A published storefront: the seller's chosen template and theme, with a theme-coloured bag bar. */
      function drawStorefront() {
        const { config, data } = shop.storefront;
        const extras = {
          payments: { online: shop.payments.online, manual: shop.payments.manual, upi: Boolean(shop.contact.upi) },
          policies: shop.policies,
          gstin: shop.gstin,
          pricesIncludeGst: shop.pricesIncludeGst,
        };
        const n = StoreCommerce.count();
        const bar = `<div class="sf-cartbar" ${n ? '' : 'hidden'}><div class="sf-wrap"><span><b>${n} item${n > 1 ? 's' : ''}</b> · ${rupees(StoreCommerce.subtotal())}</span><button class="sf-btn" type="button" data-cart>View bag</button></div></div>`;
        const page = StoreTemplates.render(config.template, { config, data, extras, cart: StoreCommerce.qtyById(), wish: sellsProducts() ? StoreCommerce.wishIds() : null });
        $('app').innerHTML = page.slice(0, page.lastIndexOf('</div>')) + bar + '</div>' + (sellsProducts() ? wishButton() + bagButton() : '');
        StoreTemplates.bind($('app'));
      }

      function drawPlain() {
        const n = StoreCommerce.count();
        $('app').innerHTML = `
    <header class="hero" style="background:${LOOKS[shop.look] || LOOKS[0]}">
      <h1>${escapeHtml(shop.shop)}</h1><p>${escapeHtml(shop.tagline || shop.city || '')}</p>
      <div class="contact">${contactButtons()}</div>
    </header>
    <main class="wrap">
      ${shop.products.length ? `<h2>Products</h2><div class="grid">${shop.products.map(productCard).join('')}</div>` : ''}
      ${shop.services.length ? `<h2>Classes and services</h2><div class="grid">${shop.services.map(productCard).join('')}</div>` : ''}
      ${!shop.products.length && !shop.services.length ? '<div class="empty">This shop has nothing to show yet. Please check back soon.</div>' : ''}
      ${aboutSection()}
    </main>
    <div class="cartbar" ${n ? '' : 'hidden'}><div class="in"><div><b>${n} item${n > 1 ? 's' : ''}</b> · <span class="price">${rupees(StoreCommerce.subtotal())}</span></div><button class="btn main" type="button" data-cart>View bag</button></div></div>
    <footer>Powered by <a href="/">Stoora</a></footer>${sellsProducts() ? wishButton() + bagButton() : ''}`;
      }

      /** Draw the page again after the bag changed, keeping the keyboard focus on the same control. */
      function draw() {
        const active = document.activeElement;
        const focus = active && active.closest && active.closest('#app') ? { id: active.dataset.id, d: active.dataset.d, view: active.dataset.view, cart: active.hasAttribute('data-cart') } : null;
        const top = window.scrollY;
        if (shop.storefront) drawStorefront();
        else drawPlain();
        window.scrollTo(0, top);
        if (focus) {
          const selector = focus.id && focus.d ? `[data-id="${CSS.escape(focus.id)}"][data-d="${focus.d}"]` : focus.id ? `[data-id="${CSS.escape(focus.id)}"]` : focus.view ? `[data-view="${CSS.escape(focus.view)}"]` : focus.cart ? '.cm-bag' : '';
          const again = selector && $('app').querySelector(selector);
          if (again) again.focus({ preventScroll: true });
        }
      }

      /* ---------- "Where is my order?" and the shop's own buttons ---------- */

      document.addEventListener('click', (event) => {
        if (event.target.closest('#track')) StoreCommerce.openTracking();
      });

      /* ---------- visitor tracking chosen by the seller (Settings > Customer events) ---------- */

      function addTracking({ metaPixel, googleAnalytics }) {
        if (googleAnalytics) {
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(googleAnalytics);
          document.head.appendChild(script);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          gtag('js', new Date());
          gtag('config', googleAnalytics);
        }
        if (metaPixel) {
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://connect.facebook.net/en_US/fbevents.js';
          document.head.appendChild(script);
          window.fbq = function () {
            (window.fbq.queue = window.fbq.queue || []).push(arguments);
          };
          fbq('init', metaPixel);
          fbq('track', 'PageView');
        }
      }

      /* ---------- start ---------- */

      (async () => {
        try {
          if (!handle) handle = (await (await fetch('/api/public/by-host')).json()).handle; // a seller's own domain
          const response = await fetch('/api/public/' + encodeURIComponent(handle));
          if (!response.ok) throw new Error('not found');
          shop = await response.json();
          document.title = (shop.storefront ? shop.storefront.config.brand.name || shop.shop : shop.shop) + ' · Stoora';
          addTracking(shop.tracking);
          StoreCommerce.init({ handle, shop, onChange: draw });
          draw();
        } catch (_) {
          $('app').innerHTML =
            '<div class="empty"><h2>Shop not found</h2><p>Check the link, or ask the shop for the right one.</p><a class="btn" href="/">Go to Stoora</a></div>';
        }
      })();
    </script>
  </body>
</html>
